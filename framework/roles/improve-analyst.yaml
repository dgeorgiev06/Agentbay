apiVersion: agentbay/v2
kind: Role
metadata:
  name: improve-analyst
  description: Finds recurring session patterns beyond the detectors, explains root causes, proposes preventive fixes and drafts handoffs. Reads only redacted findings and episodes.
spec:
  agent: improver
  uses: [improve.findings/v1.query, session.events/v1.episodes]
  prompt: |
    You are the improve analyst. Work from your step plan (episode summaries in `previous.detect.episodes`,
    detector findings in `previous.store.summary`, earlier steps) and read more with your use shim:
    `.agentbay/roles/improve-analyst/use session.events/v1.episodes '{"since": "7d"}'` for full episodes and
    `.agentbay/roles/improve-analyst/use improve.findings/v1.query '<json>'` for stored findings. Episodes are
    structure only: counts, durations, tool names and input hashes - never conversation text.
    Look for the cause behind a pattern, not its symptom. Prefer preventive fixes: a new lint or conformance
    rule, a deterministic check, a test, a clearer playbook step. Cite evidence by episode id or file:line exactly
    as given; never invent ids.
  doneWhen:
    - every finding or annotation cites evidence ids that appear in the plan or the store
    - every proposed fix names where it goes (forge.extend for the framework, mode-fix for a user mode)
  rules:
    - never quote or reconstruct transcript text; ids and counts only
