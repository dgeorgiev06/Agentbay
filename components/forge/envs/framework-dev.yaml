apiVersion: agentbay/v4
kind: Environment
metadata:
  name: framework-dev
  description: >-
    Change the agentbay framework itself; paths are relative to the agentbay checkout (the project for
    forge). Only forge.extend may place roles here.
spec:
  bind:
    workspace.read/v1: { tools: [Read, Glob, Grep] }
    workspace.write/v1:
      tools: [Edit, Write, Bash]
      # runs tests on code it writes, i.e. arbitrary code: trusted by design (forge.extend only, user approval
      # gate, mandatory opus review); real containment needs an OS sandbox
      clis: [./bay.sh check, python3 tests/run.py, git status, git diff, git log, git add, git commit, git mv, git rm]
    git.read/v1:
      tools: [Bash]
      clis: [git status, git diff, git log, git show]
  fs:
    read: ["."]
    # the four protected folders, then each protected component, env, connector and interfaces folder (lint keeps
    # this in step with the protected: block of framework/kernel.yaml), then the other components, docs and tests
    write: [framework, bay, schemas, adapters,
            components/cos, components/forge,
            components/improve/envs/improve-local.yaml, components/tools/envs/workspace.yaml,
            components/tools/envs/research.yaml,
            components/claude-transcripts, components/briefing/connectors/corpus-store,
            components/improve/connectors/artifact-graph, components/improve/connectors/git,
            components/improve/connectors/improve-detect, components/improve/connectors/improve-store,
            components/improve/connectors/ledger,
            components/briefing/interfaces, components/improve/interfaces, components/tools/interfaces,
            components, docs, tests, README.md]
  tiers: [balanced, deep]          # no fast tier for framework changes
  effects: [read, write]
  limits: { maxTurns: 120, maxMinutes: 60 }
