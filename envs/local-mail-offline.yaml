apiVersion: agentbay/v2
kind: Environment
metadata:
  name: local-mail-offline
  description: >-
    Offline stand-in for local-mail: the fake-mail source (sample mailbox or a fixture) instead of gmail-api,
    no secrets, no network. Select it with `envs: { local-mail: local-mail-offline }` in agentbay.config.yaml.
spec:
  substitutes: local-mail
  bind:
    items.source/v1: [fake-mail]
    items.store/v1: corpus-store
    workspace.read/v1: { tools: [Read, Glob, Grep] }
  network: { allow: [] }
  fs: { read: ["."], write: [".agentbay/data/mail"] }
  effects: [read, write, network, spend, delete]
  limits: { maxTurns: 40, maxMinutes: 20, spendUsd: 0, monthlyItems: 20000, maxItemsPerRun: 500 }
