apiVersion: agentbay/v3
kind: Interface
metadata:
  name: session.events
  description: >-
    Work sessions as redacted episodes (session.episode/v1): dispatcher calls and agent runs from the agentbay
    ledger, Claude Code sessions and subagents from their transcripts, commits from git. Structure and metadata
    only - steps, tool calls (name + input hash), errors, denials, interrupts, subagents, tokens, cost, durations.
spec:
  version: 1
  binding: connector
  endpoints:
    episodes:
      description: Episodes that started inside the window. Read-only.
      in:
        type: object
        additionalProperties: false
        properties:
          since: { type: string, description: "ISO-8601 or relative (7d)" }
          until: { type: string }
      out:
        type: object
        required: [episodes, stats]
        additionalProperties: false
        properties:
          episodes: { type: array, items: { $ref: session.episode/v1 } }
          stats: { type: object, description: "per-source counts: sessions, parsed, cached, badLines, unknownRecordTypes, ..." }
      effects: [read]
