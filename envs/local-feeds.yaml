apiVersion: agentbay/v3
kind: Environment
metadata:
  name: local-feeds
  description: Briefing sources and the local corpus store. Only the dispatcher touches connectors and secrets; agents read the store only through their role's use shim.
spec:
  bind:
    items.source/v1: [x-api]          # add a source = add a connector here
    items.store/v1: corpus-store
    workspace.read/v1: { tools: [Read, Glob, Grep] }
  secrets: { provider: keychain, allow: [X_CLIENT_ID, X_CLIENT_SECRET, X_REFRESH_TOKEN] }
  network: { allow: [api.x.com] }
  fs: { read: ["."], write: [".agentbay/data/feeds"] }
  effects: [read, write, network, spend, delete]
  limits: { maxTurns: 40, maxMinutes: 20, spendUsd: 5, monthlyItems: 3000, maxItemsPerRun: 500 }
  offline:                          # `offline: true` in agentbay.config.yaml: the fake source, no network, no secrets, $0
    bind: { items.source/v1: [fake] }
