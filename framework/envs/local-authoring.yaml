apiVersion: agentbay/v2
kind: Environment
metadata:
  name: local-authoring
  description: >-
    Write user content of the agentbay checkout (the project for forge) only; framework/, bay/ and
    schemas/ are out of reach.
spec:
  bind:
    forge.scaffold/v1: scaffold
    forge.migrate/v1: migrator
    workspace.read/v1: { tools: [Read, Glob, Grep] }
    workspace.write/v1:
      tools: [Edit, Write, Bash]
      # no test runner: an agent that can write code and run it escapes any hook; the user/coordinator runs tests
      clis: [./bay.sh lint, ./bay.sh validate]
    git.read/v1:
      tools: [Bash]
      clis: [git status, git diff, git log, git show]
  fs:
    read: ["."]
    write: [modes, roles, agents, envs, connectors, agentbay.config.yaml, .agentbay/data]   # .agentbay/data: migrator only (the guard denies .agentbay/ to every subagent)
  models: [haiku, sonnet, opus, inherit]
  effects: [read, write, delete]
  limits: { maxTurns: 60, maxMinutes: 30 }
