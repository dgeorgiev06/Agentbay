# A runtime adapter (contract: framework/components.yaml `adapter`, protocol bay/adapter.py).
name: claude-code
module: claude_code.py
class: ClaudeCodeAdapter
description: Claude Code (interactive) - subagents, skills, settings, guard hook and use shims under .claude/ and .agentbay/
# The agent profile: Claude Code runs every role, a mode's coordinator as a playbook in the Chief of Staff's main
# thread, every other role as a generated subagent. The only file that names Claude models.
profile:
  runtime: { coordinator: claude-code-main, worker: claude-code-subagent }
  tiers: { fast: haiku, balanced: sonnet, deep: opus }
  effort: { low: low, medium: medium, high: high }
