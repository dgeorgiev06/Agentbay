apiVersion: agentbay/v4
kind: Environment
metadata:
  name: workspace
  description: The project checkout. Read/edit files, narrow git commands. No network, no secrets, no spend; web research is env research.
spec:
  bind:
    standards.check/v1: [python-check, comments-check]
    # a test runner runs code the agent wrote, outside the guard: protected paths are not a hard limit;
    # `bay check --base` and review catch the result
    workspace.read/v1:
      tools: [Read, Glob, Grep, Bash]
      clis: [./bay.sh check, python3 tests/run.py, python3 -I -m ruff check, python3 -I -m mypy]
    workspace.write/v1:
      tools: [Edit, Write, Bash]
      clis: [git status, git diff, git log, git add, git worktree, git commit, git mv, git rm]
    git.read/v1:
      tools: [Bash]
      clis: [git status, git diff, git log, git show]
  fs: { read: ["."], write: ["."] }
  effects: [read, write]
  limits: { maxTurns: 60, maxMinutes: 30 }
