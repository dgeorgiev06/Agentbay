apiVersion: agentbay/v3
kind: Mode
metadata:
  name: feed-briefing
  version: 0.2.0
  description: Briefings and grounded Q&A over posts from accounts you follow.
spec:
  # Everything not set here comes from modes/briefing (features sync, digest, ask, prune; their playbooks,
  # rules and review; roles; skills).
  extends: briefing
  reads: [post/v1]          # the item kind its features read (B-6)
  purpose: Keep me briefed on what people I follow say; answer questions about it.
  constraints:                 # merged over briefing's (lookbackMax, spendUsd, policies)
    monthlyItems: 3000
    maxItemsPerRun: 500
  configDefaults:              # briefing's config schema, with this mode's default selector
    selectors: [{ id: home }]  # no fields: each source's default stream (the X home timeline)
