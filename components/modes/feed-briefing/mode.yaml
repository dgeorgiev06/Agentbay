name: feed-briefing
version: 1.0.0
description: Syncs posts from a source into the store, writes a digest of themes that cites them, and answers questions.

requires:
  interfaces: [items-source@1, items-store@1]

settings: schemas/settings.json

actions:
  sync:
    description: When the owner wants the newest posts from the bound source brought into the store, within the budget and the monthly cap.
    input: schemas/sync-request.json
    output: schemas/sync-result.json
    effects: [read, write, network, spend]
    run:
      - script: scripts/sync.ts
  digest:
    description: When the owner wants the themes of recent posts summed up, each claim citing the posts it rests on.
    input: schemas/digest-request.json
    output: schemas/digest.json
    effects: [read]
    run:
      - script: scripts/select.ts
      - skill: skills/digest
        tier: balanced
        checks: [scripts/check-citations.ts]
      - script: scripts/format.ts
  ask:
    description: When the owner has a question that the stored posts can answer, with every answer citing them.
    input: schemas/ask-request.json
    output: schemas/answer.json
    effects: [read]
    run:
      - skill: skills/ask
        tier: balanced
        checks: [scripts/check-answer.ts]

workflows:
  - workflows/daily.yaml
