apiVersion: agentbay/v2
kind: Connector
metadata:
  name: x-api
  description: >-
    Home timeline of the authorized X account via the official X API v2
    (GET /2/users/{id}/timelines/reverse_chronological), OAuth 2.0 user token
    with scopes tweet.read users.read offline.access.
  version: 0.1.0
spec:
  implements: feed.source/v1
  entry: x_api.py
  source: x
  window: 7d
  needs:
    secrets: [X_CLIENT_ID, X_CLIENT_SECRET, X_REFRESH_TOKEN]
    network: [api.x.com]
  config:
    type: object
    additionalProperties: false
    properties:
      userId: { type: string, description: "Numeric X user id; looked up via /2/users/me when omitted." }
      maxPages: { type: integer, minimum: 1, default: 50 }
