name: pm
version: 0.1.0
description: Interviews the owner turn by turn over a tree of questions; so far its scripts work out the frontier, check a turn and the reading of his answer, and draw the turn's card.

resources:
  files:
    read: [CONTEXT.md, docs/]

actions:
  frontier:
    description: When an interview's questions are to be put in order, to know which ones a turn may ask now and which wait.
    input: schemas/tree-request.json
    output: schemas/frontier.json
    effects: [read]
    run:
      - script: scripts/frontier.ts
  check-turn:
    description: When an interviewer's turn is to be checked by script before the owner sees it, against the tree and the files its facts quote.
    input: schemas/turn-request.json
    output: schemas/checked.json
    effects: [read]
    run:
      - script: scripts/check-turn.ts
  draw-turn:
    description: When a checked turn is to be shown to the owner as a card, each question numbered with its choices and the interviewer's recommendation.
    input: schemas/draw-request.json
    output: schemas/turn-card.json
    effects: [read]
    run:
      - script: scripts/draw-turn.ts
  read-short:
    description: When the owner answered a turn and his words may be numbers and letters only, which a script reads with no model.
    input: schemas/said-request.json
    output: schemas/short-reading.json
    effects: [read]
    run:
      - script: scripts/read-short.ts
  check-reading:
    description: When a reading of the owner's words for a turn is to be checked, so that nothing he did not say is kept as his.
    input: schemas/reading-request.json
    output: schemas/checked.json
    effects: [read]
    run:
      - script: scripts/check-reading.ts
