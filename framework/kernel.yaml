# protected: the one list of what only forge.extend may write - the rules that bind agents (guard, gates, secrets, ledger,
# boundary) and the framework's own components. Protected names are reserved; an unreadable file protects everything.
# owns: the paths the boundary check treats as core (globs; a trailing / owns everything below).
protected:
  paths: [framework, bay, schemas, adapters,
          components/cos, components/forge,
          components/improve/envs/improve-local.yaml, components/tools/envs/workspace.yaml,
          components/tools/envs/research.yaml,
          components/claude-transcripts, components/briefing/connectors/corpus-store,
          components/improve/connectors/artifact-graph, components/improve/connectors/git,
          components/improve/connectors/improve-detect, components/improve/connectors/improve-store,
          components/improve/connectors/ledger,
          components/briefing/interfaces, components/improve/interfaces, components/tools/interfaces]
  mode: [cos, forge]
  env:
    cos-local: {}
    framework-dev: {}
    improve-local: { modes: [improve] }
    local-authoring: {}
    workspace: { modes: ["*"] }
    research: { modes: ["*"] }
  connector: [artifact-graph, claude-transcripts, corpus-store, git, improve-detect, improve-store, ledger, scaffold, workflow-runner]
components:
  kernel:           # loader, resolver, lint, registry, dispatcher, ledger, guard, CLI
    owns:
      - bay/
      - schemas/
      - framework/roles/
      - framework/rules/
      - framework/kernel.yaml
      - framework/limits.yaml
      - bay.sh
      - requirements.txt
      - CHANGELOG.md                 # release metadata: written by forge.extend's release step
    contracts:
      # interim (3a replaces it with the loader): every component folder is one extension. The contract keeps the name
      # `mode`, which B-3 (features of an existing mode) and the protected mode names are keyed on.
      mode:      { at: ["components/<name>/"], schema: schemas/mode.schema.json }
      adapter:   { at: ["adapters/<name>/"], schema: schemas/adapter.schema.json, protocol: bay/adapter.py }
  briefing:          # corpus store, SQL sandbox, selector matcher, the briefing base mode
    owns:
      - components/briefing/
      - bay/contenttypes.py
      - bay/sqlsandbox.py
      - bay/selector.py
    contracts:
      source:      { implements: items.source/v1, tests: tests/contracts/items_source.py }
