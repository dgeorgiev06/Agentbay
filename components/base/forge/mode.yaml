name: forge
version: 1.0.0
description: Builds a piece of work in slices that run side by side. It reads a plan file and works out its waves, and it carries one slice through a builder in a worktree, proof and the merge card, or through up to three rounds of a test writer, a builder who never has the tests, proof and a reviewer, and then a planter who never saw the tests.

requires:
  interfaces: [proof@1, worktrees@1, requirements@1]

settings: schemas/settings.json

resources:
  db: { migrations: migrations }
  files:
    read: [docs/plans/, docs/designs/, framework/features.yaml]
    write: [.forge/worktrees/]

actions:
  waves:
    description: When a plan file needs its table of slices, its waves, its longest chain and every problem with it, worked out by script from each slice's scope and order.
    input: schemas/waves-request.json
    output: schemas/waves-response.json
    effects: [read]
    run:
      - script: scripts/waves.ts
  slice:
    description: When the owner names a planned slice to build, it is handed on to the later steps and the start card is drawn from it.
    input: schemas/slice-request.json
    output: schemas/slice-response.json
    effects: [read]
    run:
      - script: scripts/slice.ts
  begin:
    description: When the owner has answered the start card of the workflow rounds, the run goes on to cut the slice on a go-ahead and ends on stop.
    input: schemas/begin-request.json
    output: schemas/begin-response.json
    effects: [read]
    run:
      - script: scripts/begin.ts
  declare:
    description: When a builder must state which files and action names it will change, before its first edit.
    input: schemas/declare-request.json
    output: schemas/declaration.json
    effects: [read]
    run:
      - skill: skills/declare
        tier: balanced
        checks: [scripts/declared-in-scope.ts]
  build:
    description: When a declared slice is to be written in its worktree by a builder.
    input: schemas/build-request.json
    output: schemas/built.json
    effects: [read, write]
    run:
      - skill: skills/build
        tier: deep
  write-tests:
    description: When a slice's tests are to be written from its conditions and interface, before any builder works, and handed in as data.
    input: schemas/write-tests-request.json
    output: schemas/tests.json
    effects: [read]
    skillOutput: kept-packed
    run:
      - skill: skills/write-tests
        tier: balanced
        checks: [scripts/tests-handed-in.ts]
  build-without-tests:
    description: When a declared slice whose tests another wrote is to be written in its worktree by a builder who never has the tests.
    input: schemas/build-without-tests-request.json
    output: schemas/built.json
    effects: [read, write]
    run:
      - skill: skills/build-without-tests
        tier: balanced
  round:
    description: When one of a slice's three rounds is to run, the test writer and the builder each when the round before gave them something to correct, ending with proof's verdicts on one commit that holds the builder's work and the tests.
    input: schemas/round-request.json
    output: schemas/rounds.json
    effects: [read, write, network, spend, delete]
    calledOutputs: kept-packed
    run:
      - script: scripts/round.ts
  review:
    description: When a round's tests and code are to be judged against the slice's conditions and the practices no tool holds, with findings for the test writer or the builder.
    input: schemas/review-request.json
    output: schemas/review.json
    effects: [read]
    skillOutput: kept-packed
    run:
      - skill: skills/review
        tier: deep
        checks: [scripts/no-test-text.ts]
  review-round:
    description: When a round has been proved and is to be reviewed, or its failing cases sent to the builder, and the rounds' next step decided.
    input: schemas/review-round-request.json
    output: schemas/rounds.json
    effects: [read, write, delete]
    run:
      - script: scripts/review-round.ts
  plant:
    description: When a slice's rounds are done and bugs are to be written from the builder's code and the slice's conditions by a planter who never saw the tests, for proof to plant.
    input: schemas/plant-request.json
    output: schemas/planted.json
    effects: [read]
    run:
      - skill: skills/plant
        tier: balanced
        checks: [scripts/bugs-in-the-code.ts]
  bugs:
    description: When a slice's rounds are done and proof is to be given the bugs to plant, the owner's and then the planter's.
    input: schemas/bugs-request.json
    output: schemas/bugs.json
    effects: [read, write, delete]
    run:
      - script: scripts/bugs.ts
  final-proof:
    description: When a slice's rounds and its planter are done and proof is to judge the last head with the slice whole, keeping proof's answer packed, handing on only what of it quotes no test, and then forgetting the kept tests.
    input: schemas/final-proof-request.json
    output: schemas/final-proof-response.json
    effects: [read, write, network, spend, delete]
    calledOutputs: kept-packed
    scriptTimeLimitSeconds: 1800
    run:
      - script: scripts/final-proof.ts
  draw:
    description: When proof has judged a slice and the owner needs the merge card, with the rule and reason for each choice.
    input: schemas/draw-request.json
    output: schemas/draw-response.json
    effects: [read]
    run:
      - script: scripts/draw.ts
  carry-out:
    description: When the owner has chosen on the merge card and the choice is to be done.
    input: schemas/carry-out-request.json
    output: schemas/carry-out-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/carry-out.ts
  design-start:
    description: When a requirements file has been checked for a design, it stops the run on a refused file with every problem and its line, and draws the first card, on which the owner chooses the light or the full path.
    input: schemas/design-start-request.json
    output: schemas/design-start-response.json
    effects: [read]
    run:
      - script: scripts/design-start.ts
  design:
    description: When a design is to be written from checked requirements, as modules and interfaces handed in as data, each action with its schemas, the conditions it serves and worked examples.
    input: schemas/design-request.json
    output: schemas/design.json
    effects: [read]
    skillOutput: kept-packed
    run:
      - skill: skills/design
        tier: deep
        checks: [scripts/design-checked.ts]
  designs:
    description: When the owner has chosen a path on the design's first card, one designer writes the design, or two write apart, the second given nothing of the first.
    input: schemas/designs-request.json
    output: schemas/designs-response.json
    effects: [read]
    run:
      - script: scripts/designs.ts
  challenge:
    description: When a design, or two written apart, are to be judged practice by practice for the practices held by design, and one design chosen or a merged one given.
    input: schemas/challenge-request.json
    output: schemas/challenge.json
    effects: [read]
    run:
      - skill: skills/challenge
        tier: deep
        checks: [scripts/challenge-checked.ts]
  challenge-designs:
    description: When the designs are written, it lists where two differ, reads the practices held by design from the integration branch and asks the challenger.
    input: schemas/challenge-designs-request.json
    output: schemas/challenge-designs-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/challenge-designs.ts
  draw-design:
    description: When the challenger has answered and the owner needs the design card, with what was checked by script and judged by whom, and whether approve is offered.
    input: schemas/draw-design-request.json
    output: schemas/draw-design-response.json
    effects: [read]
    run:
      - script: scripts/draw-design.ts
  commit-design:
    description: When the owner has answered the design card, it commits the design and its schema files in a worktree of its own and merges them into the integration branch on approve, and ends the run on stop.
    input: schemas/commit-design-request.json
    output: schemas/commit-design-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/commit-design.ts
  plan-start:
    description: When a committed design is to be planned, it reads the design and the practices held by a plan from the integration branch, checks the design's requirements file, and stops the run on a refused one with every problem and its line.
    input: schemas/plan-start-request.json
    output: schemas/plan-start-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/plan-start.ts
  plan:
    description: When a plan is to be cut from a committed design and its requirements, as slices handed in as data, each meeting conditions and naming the interface files it builds against; or when a challenger's findings are to be answered.
    input: schemas/plan-request.json
    output: schemas/plan.json
    effects: [read]
    run:
      - skill: skills/plan
        tier: balanced
        checks: [scripts/plan-checked.ts]
  challenge-plan:
    description: When a plan is to be judged practice by practice for the practices held by a plan, with findings for its planner.
    input: schemas/plan-challenge-request.json
    output: schemas/plan-challenge.json
    effects: [read]
    run:
      - skill: skills/challenge-plan
        tier: deep
        checks: [scripts/plan-challenge-checked.ts]
  plan-again:
    description: When the first challenge of a plan is in, it asks the planner to answer its findings, only when there are any, and hands on the plan as it then stands.
    input: schemas/plan-again-request.json
    output: schemas/plan-again-response.json
    effects: [read]
    run:
      - script: scripts/plan-again.ts
  challenge-again:
    description: When the planner has answered a challenge's findings, it asks the challenger to read the answer, only when the planner was asked, and hands on the challenge as it then stands.
    input: schemas/challenge-again-request.json
    output: schemas/challenge-again-response.json
    effects: [read]
    run:
      - script: scripts/challenge-again.ts
  draw-plan:
    description: When a plan has been challenged and the owner needs the plan card, with its waves, the conditions met, the fixed files, what was checked by script and judged by whom, and whether approve is offered.
    input: schemas/draw-plan-request.json
    output: schemas/draw-plan-response.json
    effects: [read]
    run:
      - script: scripts/draw-plan.ts
  commit-plan:
    description: When the owner has answered the plan card, it commits the plan under docs/plans/ with the next free number in a worktree of its own and merges it into the integration branch on approve, naming the slice requests of its first wave, and ends the run on stop.
    input: schemas/commit-plan-request.json
    output: schemas/commit-plan-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/commit-plan.ts

workflows:
  - workflows/one-slice.yaml
  - workflows/rounds.yaml
  - workflows/design.yaml
  - workflows/plan.yaml
