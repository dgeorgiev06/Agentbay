# read-only mail (sign in: README.md of the mail connector your env binds); briefing's settings plus `important`
lookback: 30d                     # first sync reads the last 30 days (= lookbackMax)
selectors:
  - { id: partners, from: "*@partner.example" }               # `*` is matched locally: the source lists every message
                                                      # in the window; `from: partner.example` searches the domain natively
  - { id: staking,  subject: "staking", in: Work }    # a label or folder; the source's README maps it to its syntax
  - { id: news,     in: "Newsletters", since: 7d }
  - { id: sent,     in: sent }                        # your replies, so "needs reply" knows what you answered
important: ["*@partner.example", "*@example.com"]              # weighs these senders' threads first in the digest
