modes: [feed-briefing, typescript, git-worktrees]
bindings:
  items-source: fake-source
  items-store: store
  toolchain: typescript
  worktrees: git-worktrees
  proof: proof
adapter: claude-code
approvals:
  from: [terminal, chat]
tiers:
  balanced: { model: sonnet, effort: medium }
  deep: { model: opus, effort: medium }
settings:
  proof:
    links: [node_modules]
    noRise:
      - name: debt
        pattern: "rule:"
        paths: [framework/feature-map-debt.yaml]
  forge:
    featureMap: framework/features.yaml
    into: feat/0022-agentbay5
    practices: [framework/practices.md, components/base/typescript/practices.md]
  feed-briefing:
    selector:
      labels: [staking, custody]
    lookback: 15d
    maxItems: 40
  fake-source:
    baseDate: "2026-11-15T00:00:00Z"
    pageSize: 10
    costPerItemUsd: 0.001
