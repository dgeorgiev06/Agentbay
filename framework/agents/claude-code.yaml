apiVersion: agentbay/v2
kind: Agent
metadata:
  name: claude-code
  description: >-
    Claude Code runs every role: a mode's coordinator as a playbook in the Chief of Staff's main thread, every
    other role as a generated subagent. The only file that names Claude models.
spec:
  runtime: { coordinator: claude-code-main, worker: claude-code-subagent }
  tiers: { fast: haiku, balanced: sonnet, deep: opus }
  effort: { low: low, medium: medium, high: high }
