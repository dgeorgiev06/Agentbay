title: 'Forge, whole: what remains after the first eleven slices; rounds, the planter, the leak check and the cards, then requirements, design, planning and waves'
slices:
- title: 'An action may say its skill''s output is kept packed: the kernel''s own database then holds no line of it as text, and it is unpacked only for the script that called the skill'
  slice:
    name: KP1
    kind: capability
    scope:
    - schemas/mode.schema.json
    - bay/generated/mode.ts
    - bay/runs/sqlite-run-store.ts
    - bay/runs/packed-output.ts
    - bay/runs/action-steps.ts
    - tests/runs-packed-output.test.ts
    after: []
    done:
    - id: DOD-KP1-1
      says: With the action marked, a search of every file under .agentbay for a line of the skill's output finds nothing while the run waits and after it ends; the calling script still receives the output whole, also across a kernel restart; an action not marked is stored as today.
      level: must
      proof:
        kind: fails-first
        tests:
        - tests/runs-packed-output.test.ts
    - id: DOD-KP1-2
      says: bay runs shows that the output is kept packed and never prints it; events and the card hold no line of it.
      level: must
    - id: DOD-KP1-3
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'Forge rounds two and three: a failing case reaches the builder as its name, and its message only when it shares no long run of text with the tests; findings go to the test writer or the builder, the test writer never reads the builder''s code; then the owner'
  slice:
    name: FA2
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: KP1
      because: The test writer's output must not lie as text in the kernel's database while a builder works (FA1 pinned the gap).
    done:
    - id: DOD-FA2-1
      says: A slice whose tests fail in round 1 goes back to the builder with each failing case's name and message and nothing else of the test, and a slice still failing after round 3 reaches the merge card.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/rounds.test.ts
    - id: DOD-FA2-2
      says: A finding meant for the builder that holds a line of a test file is sent back to the reviewer, not passed on.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/review-check.test.ts
    - id: DOD-FA2-3
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: A planter that never saw the tests writes the bugs to plant from the builder's code and the conditions, and proof's bugs-caught item uses them
  slice:
    name: PT1
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: FA2
      because: The planter is a step of the round that FA2 builds.
    done:
    - id: DOD-PT1-1
      says: The planter's task holds the code and the conditions and no line of the tests; its bugs are handed to proof, and a bug that survives is named on the card.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/planter.test.ts
    - id: DOD-PT1-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof: &id001
        kind: checks
- title: 'After a build, forge checks for a leak: the builder''s code shares no long run of text with the tests, and a mark planted in the tests is not in the code'
  slice:
    name: LK1
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: PT1
      because: Both change forge's round, so one after the other.
    done:
    - id: DOD-LK1-1
      says: A build that copies a line of a test, or that holds the planted mark, fails the slice with a computed line that names the file and no line of the test; a build that shares only short common words passes.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/leak.test.ts
    - id: DOD-LK1-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof: *id001
- title: 'Forge''s cards in the clearer form: a failed item with proof''s reason and the failing cases, a builder''s own flagged decision as a judgement line, and whether the run had the hook'
  slice:
    name: FC2
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: LK1
      because: Both change forge's cards, so one after the other.
    done:
    - id: DOD-FC2-1
      says: The start and merge cards for the todo mode's first slice are pinned line by line in the new form, each row at most 44 columns, with a failed checks item giving its reason.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/cards.test.ts
    - id: DOD-FC2-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof: *id001
- title: The todo mode is built through forge, slice TD1 then TD2 of plan 0023, with the owner stopped at each card
  slice:
    name: TDX
    kind: mode
    scope:
    - components/modes/todo/**
    - docs/plans/0023-todo-mode.yaml
    after:
    - slice: FA2
      because: It is the test of forge with rounds.
    done:
    - id: DOD-TDX-1
      says: TD1 and TD2 are each merged from their merge card, every must item passed, with no file of the todo mode written by hand.
      level: must
    - id: DOD-TDX-2
      says: The kit's checks and its whole test run pass with the todo mode in it.
      level: must
      proof:
        kind: checks
- title: same-output and real-thing run a project's own commands, named by its toolchain, not only the kit's bay
  slice:
    name: RT1
    kind: mode
    scope:
    - components/base/interfaces/toolchain.yaml
    - components/base/interfaces/toolchain/**
    - components/base/typescript/**
    - components/base/interfaces/proof.yaml
    - components/base/interfaces/proof/**
    - components/base/proof/**
    - tests/made-up-toolchains*
    - tests/made-up-proofs*
    after: []
    done:
    - id: DOD-RT1-1
      says: In a project that is not the kit, a real-thing item whose run names a command its toolchain lists passes when the command prints the expected text.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/proof/tests/project-commands.test.ts
    - id: DOD-RT1-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'The requirements file: outcomes, conditions, what is left out; forge.requirements checks one and names every problem with its line'
  slice:
    name: RQ1
    kind: mode
    scope:
    - components/base/forge/**
    - docs/requirements/**
    after:
    - slice: FC2
      because: Both change forge, and the cards come first so that the todo mode's rebuild is read on them.
    done:
    - id: DOD-RQ1-1
      says: forge.requirements accepts docs/requirements/todo.yaml and refuses a file with a condition with no then, two conditions with one id, or an outcome with no condition, each with its line.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/requirements.test.ts
    - id: DOD-RQ1-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'System design: one design or two written apart, compared, the design card, and the design committed with its schema files'
  slice:
    name: DS1
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: RQ1
      because: A design is made from a requirements file RQ1 defines, in the same folder.
    done:
    - id: DOD-DS1-1
      says: From the todo requirements, the workflow design shows the design card with each line as printed in design A, and approve commits design.yaml and the schema files.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/design.test.ts
    - id: DOD-DS1-2
      says: The second designer's task holds nothing of the first design, and no file of the first design is on disk while it works.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/designs-apart.test.ts
    - id: DOD-DS1-3
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'Planning: slices cut from the design, each meeting conditions; a challenge by another model; waves checks that every condition is met and every fixed file is made first'
  slice:
    name: PL1
    kind: mode
    scope:
    - components/base/forge/**
    - docs/plans/README.md
    after:
    - slice: DS1
      because: A plan is cut from the design DS1 commits, in the same folder.
    done:
    - id: DOD-PL1-1
      says: forge.waves names a condition no slice meets and a slice that changes a fixed file, and still accepts plans 0022 and 0023 as they are.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/plan-meets.test.ts
    - id: DOD-PL1-2
      says: The plan card shows the waves, the conditions met and the challenge's findings, each line as printed in design A.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/plan-card.test.ts
    - id: DOD-PL1-3
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'Forge runs a wave: its slices side by side, each proved by its own tests, bugs and scope, the whole suite once on the wave''s combined result, and one merge card for the wave'
  slice:
    name: WV1
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: PL1
      because: A wave comes from a plan that planning made.
    - slice: FC2
      because: Both change forge's workflow and cards.
    done:
    - id: DOD-WV1-1
      says: A wave of two slices is proved slice by slice without the whole suite, then once with it; when that fails, each slice is proved alone to name the cause; the merge card lists both slices.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/wave.test.ts
    - id: DOD-WV1-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof: *id001
- title: 'The todo mode''s next outcome through the whole forge: requirements, design, plan and slices, the owner stopped at each card'
  slice:
    name: TDW
    kind: mode
    scope:
    - components/modes/todo/**
    - docs/requirements/todo.yaml
    - docs/designs/todo/**
    - docs/plans/0024-todo-due-dates.yaml
    after:
    - slice: PL1
      because: It runs the design and planning workflows PL1 completes.
    - slice: TDX
      because: It adds to the todo mode TDX makes.
    done:
    - id: DOD-TDW-1
      says: The design, plan and merge cards were each shown and answered, and the outcome works in a fresh project.
      level: must
    - id: DOD-TDW-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: A TypeScript project that is not the kit gets one slice built through forge, with proof's real-thing item running the project's own command
  slice:
    name: EX1
    kind: mode
    scope:
    - docs/research/forge-outside-the-kit.md
    after:
    - slice: RT1
      because: Its real-thing item runs the project's own command, which RT1 allows.
    - slice: TDX
      because: Forge is first proved on the todo mode in the kit.
    done:
    - id: DOD-EX1-1
      says: In a fresh TypeScript project with forge, proof, git-worktrees and typescript active, one slice ran from the start card to a merge, and the note records each card as printed.
      level: must
