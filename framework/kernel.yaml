# protected: the one list of what only forge.extend may write - the rules that bind agents (guard, gates, secrets, ledger,
# boundary) and the framework's own components. Protected names are reserved; an unreadable file protects everything.
# owns: the paths the boundary check treats as core (globs; a trailing / owns everything below).
protected:
  paths: [framework, bay, schemas, adapters,
          components/base/cos, components/base/forge,
          components/base/improve/envs/improve-local.yaml, components/base/tools/envs/workspace.yaml,
          components/base/tools/envs/research.yaml,
          components/base/improve/connectors/claude-transcripts, components/base/store,
          components/base/improve/connectors/artifact-graph, components/base/improve/connectors/git,
          components/base/improve/connectors/improve-detect, components/base/improve/connectors/improve-store,
          components/base/improve/connectors/ledger,
          components/base/improve/interfaces, components/base/tools/interfaces,
          components/base/python, components/base/comments]
  mode: [cos, forge, store]
  env:
    cos-local: {}
    store-local: {}
    framework-dev: {}
    improve-local: { modes: [improve] }
    local-authoring: {}
    plan-writer: { modes: ["*"] }
    workspace: { modes: ["*"] }
    research: { modes: ["*"] }
  connector: [artifact-graph, claude-transcripts, corpus-store, git, improve-detect, improve-store, ledger, scaffold,
              workflow-runner, python-check, comments-check]
owns:               # the kernel: loader, resolver, lint, registry, dispatcher, ledger, guard, CLI
  - bay/
  - bay/contenttypes.py              # the briefing files the kernel imports
  - bay/sqlsandbox.py
  - bay/selector.py
  - schemas/
  - components/base/store/
  - components/base/python/
  - components/base/comments/
  - adapters/
  - framework/roles/
  - framework/rules/
  - framework/kernel.yaml
  - framework/limits.yaml
  - bay.sh
  - requirements.txt
  - requirements-dev.txt
  - CHANGELOG.md                     # release metadata: written by forge.extend's release step
