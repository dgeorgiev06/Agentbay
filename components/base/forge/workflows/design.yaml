name: design
trigger: { manual: true }
budget: { minutes: 90 }
steps:
  - id: read
    action: requirements.check
  - id: start
    action: design-start
    input:
      checked: $steps.read.output
  - id: path
    approval: How should the design be written?
    show: $steps.start.output.card
    choices:
      light: { does: "One designer, then a review step" }
      full: { does: "Two designers apart, then a comparison" }
      stop: { does: Stop; nothing is designed }
  - id: designs
    action: designs
    input:
      choice: $steps.path.output.choice
      file: $trigger.file
      requirements: $steps.start.output.requirements
      practices: $settings.practices
      into: $settings.into
  - id: challenge
    action: challenge-designs
    input:
      file: $trigger.file
      requirements: $steps.start.output.requirements
      designs: $steps.designs.output
  - id: design-again
    action: design-again
    input:
      file: $trigger.file
      requirements: $steps.start.output.requirements
      designs: $steps.designs.output
      challenge: $steps.challenge.output
  - id: challenge-again
    action: challenge-design-again
    input:
      file: $trigger.file
      requirements: $steps.start.output.requirements
      designs: $steps.designs.output
      again: $steps.design-again.output
      first: $steps.challenge.output
  - id: draw
    action: draw-design
    input:
      file: $trigger.file
      requirements: $steps.start.output.requirements
      first: $steps.challenge.output
      again: $steps.design-again.output
      challenged: $steps.challenge-again.output
      practices: $steps.designs.output.practices
  - id: card
    approval: Commit this design?
    show: $steps.draw.output.card
    quotes: [designs, challenge, design-again, challenge-again]
    choices:
      approve: { does: Commit the design and its schema files, when: $steps.draw.output.offered.approve }
      stop: { does: Stop; nothing is committed }
  - id: commit
    action: commit-design
    input:
      choice: $steps.card.output.choice
      file: $trigger.file
      requirements: $steps.start.output.requirements
      design: $steps.design-again.output.design
      into: $settings.into
