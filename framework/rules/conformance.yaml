# Semantic conformance: what "fits the framework" means beyond `bay check`.
# Single source, read by the reviewers of forge.create and forge.extend (their review plans carry these
# rules; see `review.rulesets` in framework/modes/forge/mode.yaml) and by improve.audit, which runs every
# `check` here deterministically and leaves rules without a check to the analyst in improve.audit.
# `bay check` validates this file (schemas/conformance.schema.json, unique ids, known checks).
apiVersion: agentbay/v2
kind: Conformance
metadata:
  name: conformance
  description: Semantic framework rules for modes, features, roles, envs, connectors and their code.
rules:
  - id: C-1
    level: must
    statement: Every step of a feature (code step, role step, gate, injected review) is described in its playbook's Steps section, by step id, role, capability endpoint or gate.
    appliesTo: [mode, feature]
    check: playbook_matches_workflow
  - id: C-2
    level: should
    statement: Each Definition of Done item names an observable result (a count, field, file, command or id) rather than a quality word such as good, clean or appropriate.
    appliesTo: [mode, feature]
    check: dod_checkable
  - id: C-3
    level: should
    statement: Each rule can be decided pass or fail from the output, the code or the ledger; it does not rest on a quality word alone.
    appliesTo: [mode, feature, role]
    check: rules_testable
  - id: C-4
    level: must
    statement: Modes, playbooks, feature rules, skills and types name capabilities, never concrete tools or connectors (no `Bash`, no connector id), and no other mode except their `extends:` parent; tools and connectors are bound in envs. `bay check` refuses a `mode.yaml` that names a connector; review covers prose.
    appliesTo: [mode, feature]
    check: names_no_tools
  - id: C-5
    level: must
    statement: Declared effects match code behaviour where detectable; a connector method behind a read-only endpoint does not write files, delete or reach the network.
    appliesTo: [connector]
    check: effects_match_code
  - id: C-6
    level: must
    statement: A feature with delete effects has review on (when always), and so does a feature with spend effects unless its mode caps spend in dollars (constraints.spendUsd, enforced by the dispatcher). A feature with write effects has review on unless mode.yaml declares `review when never` explicitly because it writes only its own mode's data store.
    appliesTo: [mode, feature]
    check: review_on_side_effects
  - id: C-7
    level: should
    statement: Content uses the fixed vocabulary (Chief of Staff, Mode, Feature, Role, Agent, Environment, Connector, capability interface, content type, item, subagent); a content type is the versioned kind of an item (`<kind>/v<N>`), and an item is the unit a source produces and the store keeps; retired or synonym terms are replaced.
    appliesTo: [mode, feature, role, connector, env]
    check: vocabulary
    terms:
      AgentSpec: Role + Agent
      Layer: Environment
      sub-agent: subagent
      plugin: connector
      persona: role
  - id: C-8
    level: must
    statement: Layering holds - mode -> role -> agent -> env -> connector. Roles name capabilities, modes place roles in envs, one agent profile runs them, only envs bind connectors, and agents reach connector data only through read-only use shims. No extension imports another - a connector never loads another connector's module - so each can be added or removed alone (`bay check`, B-7); prose and READMEs may name what an env binds.
    appliesTo: [mode, role, env, connector]
  - id: C-9
    level: should
    statement: One job per concept - a feature's playbook describes only its own endpoint, a role prompt says how to do the work (not what the feature checks), and a connector implements capabilities without mode logic.
    appliesTo: [mode, feature, role, connector]
  - id: C-10
    level: should
    statement: Errors and lint messages name the concept and the fix (file:line, the missing piece, the command or key to change).
    appliesTo: [connector, mode]
