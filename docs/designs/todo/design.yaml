                        "done"
                      ]
                    }
                  }
                }
              }
            }
          ],
          "gives": [
            {
              "name": "answer",
              "schema": {
                "$ref": "schemas/todo/list-response.json"
              }
            }
          ]
        },
        {
          "name": "done",
