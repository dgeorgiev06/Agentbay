# The component map (proposal 0006, Part A). Core components own paths and define contracts;
# extensions are instances of a contract, each in its own folder (`at:`). `bay check --base` reads this map.
# Core files live only under core `owns:` paths (B-4, checked by lint). `owns:` entries are path globs: a trailing `/` owns everything below it.
#
# `protected:` is what only forge.extend may change (proposal 0008, stage 5): the guard, `bay check --base`, the
# resolver and lint read it, and a protected name is reserved (nobody else can define a mode, env or connector of that
# name). The kit refuses a map where the block is missing or malformed (nothing is writable, no name is free).
#   paths:     kit folders; the guard denies a write there to any env that does not name the path (framework-dev does)
#   mode:      protected modes (improve is an ordinary mode: its findings are decided only by `bay approve <F-id>`, the
#              interface marks that endpoint ownerOnly, so no mode file can call it)
#   env:       protected envs; `modes:` = the unprotected modes that may put roles there (`*` = every one)
#   connector: protected connectors (they scrub secrets, redact transcripts, hold the approval state)
# Modes, envs and connectors all sit in modes/, envs/ and connectors/; a protected one is writable only where an
# env's fs.write names its own folder (framework-dev does), so each protected instance path is in the policy.
# Lint keeps framework-dev's fs.write in step with this block: it names every protected path it may write.
protected:
  paths: [framework, bay, schemas, adapters]
  mode: [cos, forge]
  env:
    cos-local: {}
    framework-dev: {}
    improve-local: { modes: [improve] }
    local-authoring: {}
    workspace: { modes: ["*"] }
    research: { modes: ["*"] }
  connector: [artifact-graph, claude-transcripts, corpus-store, git, improve-detect, improve-store, ledger, scaffold, workflow-runner]
components:
  kernel:           # loader, resolver, lint, registry, dispatcher, ledger, guard, CLI
    owns:
      - bay/
      - schemas/
      - framework/roles/
      - framework/rules/
      - framework/interfaces/
      - framework/components.yaml
      - coordinator/
      - bay.sh
      - requirements.txt
      - CHANGELOG.md                 # release metadata: written by forge.extend's release step
    contracts:
      mode:      { at: ["modes/<name>/"], schema: schemas/mode.schema.json, tests: tests/contracts/mode.py }
      env:       { at: ["envs/<name>.yaml"], schema: schemas/environment.schema.json }
      connector: { at: ["connectors/<name>/"], schema: schemas/connector.schema.json, tests: tests/contracts/connector.py }
      interface: { at: ["interfaces/<name>.yaml"], schema: schemas/interface.schema.json }
      adapter:   { at: ["adapters/<name>/"], schema: schemas/adapter.schema.json, protocol: bay/adapter.py }
  briefing:          # corpus store, SQL sandbox, selector matcher, the briefing base mode
    owns:
      - connectors/corpus-store/
      - bay/contenttypes.py
      - bay/sqlsandbox.py
      - bay/selector.py
      - framework/interfaces/items.*
      - modes/briefing/
    contracts:
      contentType: { at: ["content-types/<name>/"], schema: schemas/content-type.schema.json, tests: tests/contracts/content_type.py }
      source:      { implements: items.source/v1, tests: tests/contracts/items_source.py }
