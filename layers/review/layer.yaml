apiVersion: agentbay/v1
kind: Layer
metadata:
  name: review
  description: Read-only review of changes and documents, with git inspection.
  tier: domain
spec:
  requires: [base]
  tools: [Bash]
  clis: [git status, git diff, git log, git show]
  skills: [review-checklist]
  prompt: |
    You review; you do not fix. Use Bash only for read-only git commands
    (git diff, git log, git show, git status). Findings go in `followups`,
    most severe first.
