apiVersion: agentbay/v3
kind: Connector
metadata:
  name: workflow-runner
  description: >-
    Stage cursor for project workflows. Keeps run state in .agentbay/data/workflows/ and hands each stage back as
    a `<mode>.<endpoint>` call for the coordinator to make. It never calls an endpoint itself, never spawns an
    agent and never reads connector data.
  version: 0.1.0
spec:
  implements: [workflow.run/v1]
  entry: workflow_runner.py
  needs:
    fs: { write: [.agentbay/data/workflows] }
