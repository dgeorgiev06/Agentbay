apiVersion: agentbay/v2
kind: Mode
metadata:
  name: mail-briefing
  version: 0.1.0
  description: Thread-based briefings and grounded Q&A over your Gmail, read-only, kept to the selectors you set.
spec:
  # Everything not set here comes from modes/briefing (features sync, digest, ask, prune; their review; the
  # sync and prune playbooks and rules; skills it does not override).
  extends: briefing
  reads: [email/v1]          # the item kind its features read (B-6)
  purpose: >-
    Keep me briefed on my email: what needs my reply, the deadlines and asks, what important senders wrote and
    which attachments matter; answer questions about it from the stored messages only.
  roles: { lead: local-mail, analyst: local-mail, reviewer: local-mail }   # role -> env
  endpoints:
    digest:
      description: Thread-based digest - needs reply, deadlines and asks, by selector or sender (important first), notable attachments.
      playbook: features/digest/playbook.md
      rules: features/digest/rules.yaml
    ask:
      description: Answer a question from stored email via read-only SQL over v_email, v_threads and v_attachments, citing message ids.
      playbook: features/ask/playbook.md
      rules: features/ask/rules.yaml
  workflows:
    digest:
      - { id: refresh, run: items.store/v1.sync, when: "stale > 2h" }      # code step, no agent
      - { id: gather, run: items.store/v1.threads, with: { since: "$in.since|$config.lookback", until: "$in.until", selector: "$in.selector", important: "$config.important", limit: 200 } }
      - { id: digest, role: analyst, out: Digest, task: "Write the mail digest from the gathered threads." }
  constraints:                 # merged over briefing's (lookbackMax 30d, spendUsd, policies)
    maxItemsPerRun: 500        # messages one sync may read (messages.get calls)
    monthlyItems: 20000
  config: config.schema.json   # adds `important` to briefing's settings (a child schema only adds keys)
  configDefaults:              # this mode's defaults
    lookback: 30d
    selectors: [{ id: inbox, in: inbox }, { id: sent, in: sent }]   # sent mail: so needs-reply sees your replies
