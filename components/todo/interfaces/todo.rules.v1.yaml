apiVersion: agentbay/v4
kind: Interface
metadata:
  name: todo.rules
  description: >-
    The rules of a to-do list as pure functions: which status moves are allowed, when a recurring to-do comes next
    and the exact delegation call for a to-do. Every endpoint only reads its input. None touches a store, so the
    caller reads the to-do first and writes the result afterwards.
spec:
  version: 1
  binding: connector
  endpoints:
    plan:
      description: >-
        Check one status change of a todoitem and say what to write. open, doing and waiting move freely among
        themselves; any of them can go to done or dropped; done and dropped can go back to open. Any other move is
        refused with an error that names it. `set` holds the fields to update (status, completedAt or droppedAt,
        threadId when the to-do starts a series, and the whole history list with one new entry
        {at, field, from, to} appended). `next` is the new todoitem for the next occurrence when a recurring to-do
        is completed or dropped, else null. scope series on a drop ends the series, so `next` is null.
      in:
        type: object
        required: [item, action]
        additionalProperties: false
        properties:
          item: { type: object, required: [title], description: "The stored todoitem (id, status, due, recur, history, ...)." }
          action: { enum: [complete, reopen, drop, status] }
          status: { enum: [open, doing, waiting, done, dropped], description: "The new status; required for action status." }
          scope: { enum: [occurrence, series], description: "Default occurrence. series is accepted only when the to-do is dropped." }
          at: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}(T.+)?$", description: "When the change happens; default now." }
      out:
        type: object
        required: [set, next]
        additionalProperties: false
        properties:
          set: { type: object }
          next: { type: [object, "null"] }
      effects: [read]
    recurrence:
      description: >-
        The due date of the occurrence after `due`, from a recur {every, unit day|week|month, on?, day?, from?}.
        With from done the count starts at the day of `doneAt`. The time part of a datetime due is kept.
      in:
        type: object
        required: [recur]
        additionalProperties: false
        properties:
          recur: { type: object }
          due: { type: [string, "null"], description: "ISO date or datetime of the occurrence just finished." }
          doneAt: { type: string, description: "ISO date or datetime it was finished; default now. Used when from is done or there is no due." }
      out:
        type: object
        required: [next]
        additionalProperties: false
        properties:
          next: { type: string }
      effects: [read]
    brief:
      description: >-
        The exact input of the delegation call for a to-do: target delivery.build or delivery.research and the Task
        input (goal, deliverable, context, constraints), valid against the Task schema. The to-do text is quoted in
        the goal as data. Refused for a done or dropped to-do.
      in:
        type: object
        required: [item, to]
        additionalProperties: false
        properties:
          item: { type: object, required: [title] }
          to: { enum: [build, research] }
          deliverable: { type: string, minLength: 3 }
      out:
        type: object
        required: [target, input]
        additionalProperties: false
        properties:
          target: { enum: [delivery.build, delivery.research] }
          input: { type: object, required: [goal, deliverable] }
      effects: [read]
