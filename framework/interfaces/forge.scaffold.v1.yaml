apiVersion: agentbay/v2
kind: Interface
metadata:
  name: forge.scaffold
  description: >-
    Render a forge template (mode, feature, connector, env) into user space. Shared by `bay <kind> new` and
    forge.create. Also reads a proposal's approval status for forge.extend.
spec:
  version: 1
  binding: connector
  dispatcherOnly: true        # code steps only: no role reads it, even in a mode that needs it
  endpoints:
    create:
      in:
        type: object
        required: [kind, name]
        additionalProperties: false
        properties:
          kind: { enum: [mode, feature, connector, env] }
          name: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
          target: { type: string, description: "kind=feature: the mode to add it to" }
          implements: { type: string, description: "kind=connector: interface, e.g. items.source/v1" }
          intent: { type: string }
      out:
        type: object
        required: [kind, name, files]
        additionalProperties: false
        properties:
          kind: { type: string }
          name: { type: string }
          files: { type: array, items: { type: string } }
          todo: { type: array, items: { type: string } }
      effects: [write]
    proposal:
      description: >-
        The approval status in a proposal's front matter (`status: approved` with `approvedBy` and `date`). It is
        informational: it grants nothing: only a recorded `bay approve` of the proposal's exact content skips
        `propose` and the `approve` gate.
      in:
        type: object
        required: [path]
        additionalProperties: false
        properties:
          path: { type: string, pattern: "^docs/proposals/[A-Za-z0-9][A-Za-z0-9._-]*\\.md$" }
      out:
        type: object
        required: [path, approved]
        additionalProperties: false
        properties:
          path: { type: string }
          approved: { type: boolean, description: "status is approved and approvedBy and date are set" }
          status: { type: string }
          approvedBy: { type: string }
          date: { type: string }
      effects: [read]
