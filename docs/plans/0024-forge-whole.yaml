title: 'Forge, whole: what remains after the first eleven slices; rounds, the planter, the leak check and the cards, then requirements, design, planning and waves'
slices:
- title: The todo mode is built through forge, slice TD1 then TD2 of plan 0023, with the owner stopped at each card
  slice:
    name: TDX
    kind: mode
    scope:
    - components/modes/todo/**
    - docs/plans/0023-todo-mode.yaml
    after: []
    done:
    - id: DOD-TDX-1
      says: TD1 and TD2 are each merged from their merge card, every must item passed, with no file of the todo mode written by hand.
      level: must
    - id: DOD-TDX-2
      says: The kit's checks and its whole test run pass with the todo mode in it.
      level: must
      proof:
        kind: checks
- title: 'System design: one design or two written apart, compared, the design card, and the design committed with its schema files'
  slice:
    name: DS1
    kind: mode
    scope:
    - components/base/forge/**
    after: []
    done:
    - id: DOD-DS1-1
      says: From the todo requirements, the workflow design shows the design card with each line as printed in design A, and approve commits design.yaml and the schema files.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/design.test.ts
    - id: DOD-DS1-2
      says: The second designer's task holds nothing of the first design, and no file of the first design is on disk while it works.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/designs-apart.test.ts
    - id: DOD-DS1-3
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'Planning: slices cut from the design, each meeting conditions; a challenge by another model; waves checks that every condition is met and every fixed file is made first'
  slice:
    name: PL1
    kind: mode
    scope:
    - components/base/forge/**
    - docs/plans/README.md
    after:
    - slice: DS1
      because: A plan is cut from the design DS1 commits, in the same folder.
    done:
    - id: DOD-PL1-1
      says: forge.waves names a condition no slice meets and a slice that changes a fixed file, and still accepts plans 0022 and 0023 as they are.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/plan-meets.test.ts
    - id: DOD-PL1-2
      says: The plan card shows the waves, the conditions met and the challenge's findings, each line as printed in design A.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/plan-card.test.ts
    - id: DOD-PL1-3
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'Forge runs a wave: its slices side by side, each proved by its own tests, bugs and scope, the whole suite once on the wave''s combined result, and one merge card for the wave'
  slice:
    name: WV1
    kind: mode
    scope:
    - components/base/forge/**
    after:
    - slice: PL1
      because: A wave comes from a plan that planning made.
    done:
    - id: DOD-WV1-1
      says: A wave of two slices is proved slice by slice without the whole suite, then once with it; when that fails, each slice is proved alone to name the cause; the merge card lists both slices.
      level: must
      proof:
        kind: fails-first
        tests:
        - components/base/forge/tests/wave.test.ts
    - id: DOD-WV1-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: 'The todo mode''s next outcome through the whole forge: requirements, design, plan and slices, the owner stopped at each card'
  slice:
    name: TDW
    kind: mode
    scope:
    - components/modes/todo/**
    - docs/requirements/todo.yaml
    - docs/designs/todo/**
    - docs/plans/0024-todo-due-dates.yaml
    after:
    - slice: PL1
      because: It runs the design and planning workflows PL1 completes.
    - slice: TDX
      because: It adds to the todo mode TDX makes.
    done:
    - id: DOD-TDW-1
      says: The design, plan and merge cards were each shown and answered, and the outcome works in a fresh project.
      level: must
    - id: DOD-TDW-2
      says: The kit's checks and its whole test run pass.
      level: must
      proof:
        kind: checks
- title: A TypeScript project that is not the kit gets one slice built through forge, with proof's real-thing item running the project's own command
  slice:
    name: EX1
    kind: mode
    scope:
    - docs/research/forge-outside-the-kit.md
    after:
    - slice: TDX
      because: Forge is first proved on the todo mode in the kit.
    done:
    - id: DOD-EX1-1
      says: In a fresh TypeScript project with forge, proof, git-worktrees and typescript active, one slice ran from the start card to a merge, and the note records each card as printed.
      level: must
