name: forge
version: 1.0.0
description: Builds a piece of work in slices that run side by side. It reads a plan file and works out its waves, and it carries one slice through a builder in a worktree, proof and the merge card, or through up to three rounds of a test writer, a builder who never has the tests, proof and a reviewer, and then a planter who never saw the tests.

requires:
  interfaces: [proof@1, worktrees@1, requirements@1, toolchain@1]

settings: schemas/settings.json

resources:
  db: { migrations: migrations }
  files:
    read: [docs/plans/, docs/designs/, framework/features.yaml]
    write: [.forge/worktrees/]

actions:
  waves:
    description: When a plan file needs its table of slices, its waves, its longest chain and every problem with it, worked out by script from each slice's scope and order.
    input: schemas/waves-request.json
    output: schemas/waves-response.json
    effects: [read]
    run:
      - script: scripts/waves.ts
  slice:
    description: When the owner names a planned slice to build, it is handed on to the later steps and the start card is drawn from it.
    input: schemas/slice-request.json
    output: schemas/slice-response.json
    effects: [read]
    run:
      - script: scripts/slice.ts
  leftovers:
    description: When a slice is about to start in the workflow rounds, it finds the branches an earlier run of the same slice left that may hold work, each with its commit, by asking worktrees.find-branch, and changes nothing.
    input: schemas/leftovers-request.json
    output: schemas/leftovers-response.json
    effects: [read]
    run:
      - script: scripts/leftovers.ts
  begin:
    description: When the owner has answered the start card of the workflow rounds, the run goes on to cut the slice on a go-ahead and ends on stop; building over an earlier run's branches drops them first and answers each commit.
    input: schemas/begin-request.json
    output: schemas/begin-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/begin.ts
  pin:
    description: When a slice's worktree has been cut at the base and before anyone works in it, a hash of each interface file's content is recorded, for the merge card to compare with the same files at the last head.
    input: schemas/pin-request.json
    output: schemas/pin-response.json
    effects: [read]
    run:
      - script: scripts/pin.ts
  declare:
    description: When a builder must state which files and action names it will change, before its first edit.
    input: schemas/declare-request.json
    output: schemas/declaration.json
    effects: [read]
    run:
      - skill: skills/declare
        role: builder
        checks: [scripts/declared-in-scope.ts]
  build:
    description: When a declared slice is to be written in its worktree by a builder.
    input: schemas/build-request.json
    output: schemas/built.json
    effects: [read, write]
    run:
      - skill: skills/build
        role: builder
  write-tests:
    description: When a slice's tests are to be written from its conditions and interface, before any builder works, and handed in as data.
    input: schemas/write-tests-request.json
    output: schemas/tests.json
    effects: [read]
    skillOutput: kept-packed
    run:
      - skill: skills/write-tests
        role: test writer
        checks: [scripts/tests-handed-in.ts]
  build-without-tests:
    description: When a declared slice whose tests another wrote is to be written in its worktree by a builder who never has the tests.
    input: schemas/build-without-tests-request.json
    output: schemas/built.json
    effects: [read, write]
    run:
      - skill: skills/build-without-tests
        role: builder
  round:
    description: When one of a slice's three rounds is to run, the test writer and the builder each when the round before gave them something to correct, ending with proof's verdicts on one commit that holds the builder's work and the tests.
    input: schemas/round-request.json
    output: schemas/rounds.json
    effects: [read, write, network, spend, delete]
    calledOutputs: kept-packed
    run:
      - script: scripts/round.ts
  review:
    description: When a round's tests and code are to be judged against the slice's conditions and the practices no tool holds, with findings for the test writer or the builder.
    input: schemas/review-request.json
    output: schemas/review.json
    effects: [read]
    skillOutput: kept-packed
    run:
      - skill: skills/review
        role: reviewer
        checks: [scripts/no-test-text.ts]
  review-round:
    description: When a round has been proved and is to be reviewed, or its failing cases sent to the builder, and the rounds' next step decided.
    input: schemas/review-round-request.json
    output: schemas/rounds.json
    effects: [read, write, delete]
    run:
      - script: scripts/review-round.ts
  plant:
    description: When a slice's rounds are done and bugs are to be written from the builder's code and the slice's conditions by a planter who never saw the tests, for proof to plant.
    input: schemas/plant-request.json
    output: schemas/planted.json
    effects: [read]
    run:
      - skill: skills/plant
        role: planter
        checks: [scripts/bugs-in-the-code.ts]
  bugs:
    description: When a slice's rounds are done and proof is to be given the bugs to plant, the owner's and then the planter's.
    input: schemas/bugs-request.json
    output: schemas/bugs.json
    effects: [read, write, delete]
    run:
      - script: scripts/bugs.ts
  final-proof:
    description: When a slice's rounds and its planter are done and proof is to judge the last head with the slice whole, keeping proof's answer packed, handing on only what of it quotes no test, and then forgetting the kept tests.
    input: schemas/final-proof-request.json
    output: schemas/final-proof-response.json
    effects: [read, write, network, spend, delete]
    calledOutputs: kept-packed
    scriptTimeLimitSeconds: 1800
    run:
      - script: scripts/final-proof.ts
  draw:
    description: When proof has judged a slice and the owner needs the merge card, with the rule and reason for each choice.
    input: schemas/draw-request.json
    output: schemas/draw-response.json
    effects: [read]
    run:
      - script: scripts/draw.ts
  carry-out:
    description: When the owner has chosen on the merge card and the choice is to be done; a merge drops the slice's branches once its work is in the integration branch, and keep leaves the two branches the card names.
    input: schemas/carry-out-request.json
    output: schemas/carry-out-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/carry-out.ts
  attempt:
    description: When a slice's item of a wave starts, or starts again after the owner chose a rerun, it sets aside and removes the worktrees an earlier attempt or run left and drops the slice's branches, answering each commit, so the slice is cut under its own name; a branch an earlier run left is there only when the owner chose build-over on the start card.
    input: schemas/attempt-request.json
    output: schemas/attempt-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/attempt.ts
  worktrees-left:
    description: When a script must know which worktree folders are left under .forge/worktrees before it removes one, it lists them, and its answer holds the list, so a replay of the calling script makes the same calls.
    input: schemas/worktrees-left-request.json
    output: schemas/worktrees-left-response.json
    effects: [read]
    run:
      - script: scripts/worktrees-left.ts
  gate-checks:
    description: When a slice of the workflow one-slice is about to be proved, its checks items are planned by the gate its kind and scope decide; under the mode gate each runs bay check on the head and takes its test run from the mode's test files at the head and the setting modeGateTests.
    input: schemas/gate-checks-request.json
    output: schemas/gate-checks-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/gate-checks.ts
  read-on-branch:
    description: When a script needs files as they are at a commit, or the files under a folder there, it reads them in a worktree of their own and removes it, and its answer holds the texts and the files listed, so a replay of the calling script reads the same after the worktree is gone.
    input: schemas/read-on-branch-request.json
    output: schemas/read-on-branch-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/read-on-branch.ts
  wave:
    description: When the owner asks for a wave of a committed plan, it reads the plan at the head of the integration branch, works out its waves as forge.waves does, refuses with every reason a wave that cannot be built, finds the branches an earlier run of the wave left, and draws the wave's start card and its slice requests, with how many are built side by side.
    input: schemas/wave-request.json
    output: schemas/wave-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/wave.ts
  wave-begin:
    description: When the owner has answered the wave's start card, the run goes on to build the slices on build or build-over and ends on stop; if the run fails later, the kernel undoes it by forgetting every slice's kept tests. It changes nothing itself, so that undo runs.
    input: schemas/wave-begin-request.json
    output: schemas/wave-begin-response.json
    effects: [read]
    undo: forget-wave
    run:
      - script: scripts/wave-begin.ts
  forget-wave:
    description: When a wave's run has failed, it forgets the kept tests and findings of every slice of the wave.
    input: schemas/forget-wave-request.json
    output: schemas/forget-wave-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/forget-wave.ts
  slice-proof:
    description: When a slice of a wave is to be judged after its rounds and its planter, proof judges the last head with the slice whole but for its checks items, which the wave proves once; the answer is kept packed, and only what of it quotes no kept test is handed on.
    input: schemas/slice-proof-request.json
    output: schemas/slice-proof-response.json
    effects: [read, write, network, spend, delete]
    calledOutputs: kept-packed
    scriptTimeLimitSeconds: 1800
    run:
      - script: scripts/slice-proof.ts
  settle:
    description: When a slice of a wave has been proved, it hands the slice on with its rounds, pins, bugs and own proof, and says why its own proof did not pass, or that it goes into the combined head.
    input: schemas/settle-request.json
    output: schemas/settle-response.json
    effects: [read]
    run:
      - script: scripts/settle.ts
  combine:
    description: When a wave's slices are settled, it merges each that passed its own proof onto the wave's base in plan order, on a branch of the wave's own, and stops at a merge that does not apply, naming both sides.
    input: schemas/combine-request.json
    output: schemas/combine-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/combine.ts
  prove-checks:
    description: When a head's checks and whole test run are to be judged, the wave's combined head or one slice alone, proof is asked once; the answer is kept packed and filtered against the kept tests of the slices named, and when a checks item failed, the solo proofs are handed on.
    input: schemas/prove-checks-request.json
    output: schemas/prove-checks-response.json
    effects: [read, write, network, spend, delete]
    calledOutputs: kept-packed
    scriptTimeLimitSeconds: 3600
    run:
      - script: scripts/prove-checks.ts
  draw-wave:
    description: When a wave's combined head has been proved, it draws the wave's merge card, with every slice's block, the combined head's checks and the solo proofs, and whether merge is offered.
    input: schemas/draw-wave-request.json
    output: schemas/draw-wave-response.json
    effects: [read]
    run:
      - script: scripts/draw-wave.ts
  carry-out-wave:
    description: When the owner has chosen on the wave's merge card, it merges the combined head into the integration branch on merge, keeping only the branches of the slices left out, and on keep keeps the branches the card names, dropping the rest; it forgets every slice's kept tests either way.
    input: schemas/carry-out-wave-request.json
    output: schemas/carry-out-wave-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/carry-out-wave.ts
  design-start:
    description: When a requirements file has been checked for a design, it stops the run on a refused file with every problem and its line, and draws the first card, on which the owner chooses the light or the full path.
    input: schemas/design-start-request.json
    output: schemas/design-start-response.json
    effects: [read]
    run:
      - script: scripts/design-start.ts
  design:
    description: When a design is to be written from checked requirements and the practices it is judged on, as modules and interfaces handed in as data, each action with its schemas, the conditions it serves and worked examples, and how it holds each practice; or when a challenger's answers and findings are to be answered once.
    input: schemas/design-request.json
    output: schemas/design.json
    effects: [read]
    skillOutput: kept-packed
    run:
      - skill: skills/design
        role: designer
        checks: [scripts/design-checked.ts]
  designs:
    description: When the owner has chosen a path on the design's first card, it reads the practices held by design from the integration branch, and one designer writes the design, or two write apart, the second given nothing of the first, each given those practices.
    input: schemas/designs-request.json
    output: schemas/designs-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/designs.ts
  challenge:
    description: When a design, or two written apart, are to be judged practice by practice for the practices held by design, with findings that are not a practice's answer, and one design chosen or a merged one given; or when a designer's answer to a challenge is to be judged once more.
    input: schemas/challenge-request.json
    output: schemas/challenge.json
    effects: [read]
    run:
      - skill: skills/challenge
        role: challenger
        checks: [scripts/challenge-checked.ts]
  challenge-designs:
    description: When the designs are written, it lists where two differ and asks the challenger, with the practices the designers were given.
    input: schemas/challenge-designs-request.json
    output: schemas/challenge-designs-response.json
    effects: [read]
    run:
      - script: scripts/challenge-designs.ts
  design-again:
    description: When the first challenge of a design is in, it asks the designer of the chosen design to answer once each practice answered not held and each finding, only when there are any, and hands on the design as it then stands.
    input: schemas/design-again-request.json
    output: schemas/design-again-response.json
    effects: [read]
    run:
      - script: scripts/design-again.ts
  challenge-design-again:
    description: When the designer has answered a design's first challenge, it asks the challenger to judge the answered design once more, only when the designer was asked, and hands on the challenge that decides the card.
    input: schemas/challenge-design-again-request.json
    output: schemas/challenge-design-again-response.json
    effects: [read]
    run:
      - script: scripts/challenge-design-again.ts
  draw-design:
    description: When the challenger has answered and the owner needs the design card, with what was checked by script and judged by whom, and whether approve is offered.
    input: schemas/draw-design-request.json
    output: schemas/draw-design-response.json
    effects: [read]
    run:
      - script: scripts/draw-design.ts
  commit-design:
    description: When the owner has answered the design card, it commits the design and its schema files in a worktree of its own and merges them into the integration branch on approve, and ends the run on stop.
    input: schemas/commit-design-request.json
    output: schemas/commit-design-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/commit-design.ts
  plan-start:
    description: When a committed design is to be planned, it reads the design and the practices held by a plan from the integration branch, checks the design's requirements file, and stops the run on a refused one with every problem and its line.
    input: schemas/plan-start-request.json
    output: schemas/plan-start-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/plan-start.ts
  plan:
    description: When a plan is to be cut from a committed design and its requirements, as slices handed in as data, each meeting conditions and naming the interface files it builds against; or when a challenger's findings are to be answered.
    input: schemas/plan-request.json
    output: schemas/plan.json
    effects: [read]
    run:
      - skill: skills/plan
        role: planner
        checks: [scripts/plan-checked.ts]
  challenge-plan:
    description: When a plan is to be judged practice by practice for the practices held by a plan, with findings for its planner.
    input: schemas/plan-challenge-request.json
    output: schemas/plan-challenge.json
    effects: [read]
    run:
      - skill: skills/challenge-plan
        role: challenger
        checks: [scripts/plan-challenge-checked.ts]
  plan-again:
    description: When the first challenge of a plan is in, it asks the planner to answer its findings, only when there are any, and hands on the plan as it then stands.
    input: schemas/plan-again-request.json
    output: schemas/plan-again-response.json
    effects: [read]
    run:
      - script: scripts/plan-again.ts
  challenge-again:
    description: When the planner has answered a challenge's findings, it asks the challenger to read the answer, only when the planner was asked, and hands on the challenge as it then stands.
    input: schemas/challenge-again-request.json
    output: schemas/challenge-again-response.json
    effects: [read]
    run:
      - script: scripts/challenge-again.ts
  draw-plan:
    description: When a plan has been challenged and the owner needs the plan card, with its waves, the conditions met, the fixed files, what was checked by script and judged by whom, and whether approve is offered.
    input: schemas/draw-plan-request.json
    output: schemas/draw-plan-response.json
    effects: [read]
    run:
      - script: scripts/draw-plan.ts
  commit-plan:
    description: When the owner has answered the plan card, it commits the plan under docs/plans/ with the next free number in a worktree of its own and merges it into the integration branch on approve, naming the slice requests of its first wave, and ends the run on stop.
    input: schemas/commit-plan-request.json
    output: schemas/commit-plan-response.json
    effects: [read, write, delete]
    run:
      - script: scripts/commit-plan.ts

workflows:
  - workflows/one-slice.yaml
  - workflows/rounds.yaml
  - workflows/wave.yaml
  - workflows/design.yaml
  - workflows/plan.yaml
