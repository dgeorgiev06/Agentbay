apiVersion: agentbay/v4
kind: Environment
metadata:
  name: local-authoring
  description: >-
    Write user content of the agentbay checkout (the project for forge) only; framework/, bay/ and
    schemas/ are out of reach.
spec:
  bind:
    forge.scaffold/v1: scaffold
    improve.detect/v1: improve-detect       # forge.extend's dead-code check
    session.events/v1: ledger
    review.verdicts/v1: ledger
    artifacts.read/v1: artifact-graph
    # a test runner runs code the agent wrote, outside the guard: `fs.write` below is not a hard limit;
    # `bay check --base` and review catch the result
    workspace.read/v1: { tools: [Read, Glob, Grep, Bash], clis: [./bay.sh check, python3 tests/run.py] }
    workspace.write/v1:
      tools: [Edit, Write, Bash]
      clis: [git add, git commit, git mv, git rm]
    git.read/v1:
      tools: [Bash]
      clis: [git status, git diff, git log, git show]
  fs:
    read: ["."]
    write: [components, agentbay.config.yaml]
  effects: [read, write]
  limits: { maxTurns: 60, maxMinutes: 30 }
