{
  "job": "todo",
  "requirements": {
    "file": "docs/requirements/todo.yaml",
    "version": 2
  },
  "modules": [
    {
      "name": "todo",
      "hides": "How todos are kept, checked and numbered, so that ids are never reused.",
      "implements": [
        "todo"
      ],
      "owns": {
        "tables": [
          "todos",
          "todo-ids"
        ],
        "files": []
      },
      "rules": [
        {
          "name": "add",
          "decides": "Whether a text may be added once trimmed of whitespace, counting characters as a person sees them, and the id the new todo gets, which is 1 when next-id is null because todo-ids holds nothing yet.",
          "takes": [
            {
              "name": "request",
              "schema": {
                "$ref": "schemas/todo/add-request.json"
              }
            },
            {
              "name": "todos",
              "store": "todos",
              "schema": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "text",
                    "status"
                  ],
                  "properties": {
                    "id": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "text": {
                      "type": "string",
                      "minLength": 1,
                      "pattern": "^\\S([\\s\\S]*\\S)?$"
                    },
                    "status": {
                      "enum": [
                        "open",
                        "done"
                      ]
                    }
                  }
                }
              }
            },
            {
              "name": "next-id",
              "store": "todo-ids",
              "schema": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 1
              }
            }
          ],
          "gives": [
            {
              "name": "todos",
              "store": "todos",
              "schema": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "text",
                    "status"
                  ],
                  "properties": {
                    "id": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "text": {
                      "type": "string",
                      "minLength": 1,
                      "pattern": "^\\S([\\s\\S]*\\S)?$"
                    },
                    "status": {
                      "enum": [
                        "open",
                        "done"
                      ]
                    }
                  }
                }
              }
            },
            {
              "name": "next-id",
              "store": "todo-ids",
              "schema": {
                "type": "integer",
                "minimum": 1
              }
            },
            {
              "name": "answer",
              "schema": {
                "$ref": "schemas/todo/add-response.json"
              }
            }
          ]
        },
        {
          "name": "list",
          "decides": "Which todos are shown, the open ones or all, in the order they were added.",
          "takes": [
            {
              "name": "request",
              "schema": {
                "$ref": "schemas/todo/list-request.json"
              }
            },
            {
              "name": "todos",
              "store": "todos",
              "schema": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "text",
                    "status"
                  ],
                  "properties": {
                    "id": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "text": {
                      "type": "string",
                      "minLength": 1,
