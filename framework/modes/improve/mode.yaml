apiVersion: agentbay/v2
kind: Mode
metadata:
  name: improve
  version: 0.1.0
  description: "Find recurring failures and waste in sessions and in the code and content, with evidence; route human-approved fixes to forge."
spec:
  purpose: "Collect recurring failures, waste and framework drift from sessions, code and content with evidence, rank them in a weekly backlog for the user, and hand approved items to forge. improve never edits what it inspects."
  endpoints:
    scan:
      description: "Session lens: redacted episodes in a window -> deterministic detectors -> analyst pattern finding."
      workflow: scan
      in: ScanReq
      out: RecordOut
      effects: [read, write]
      playbook: features/scan/playbook.md
      rules: features/scan/rules.yaml
      review: { when: never }
    audit:
      description: "Artifact lens: slop, unused implementation, inefficiency and conformance violations."
      workflow: audit
      in: AuditReq
      out: RecordOut
      effects: [read, write]
      playbook: features/audit/playbook.md
      rules: features/audit/rules.yaml
      review: { when: never }
    triage:
      description: "Dedup, cross-lens links, priority; the analyst explains root causes and proposes fixes; the reviewer checks the evidence."
      workflow: triage
      in: TriageReq
      out: RecordOut
      effects: [read, write]
      playbook: features/triage/playbook.md
      rules: features/triage/rules.yaml
      review: { role: reviewer, when: always, tier: balanced, effort: high }
    backlog:
      description: "Weekly backlog report with the top items, evidence and proposed fixes; the user decides each item."
      workflow: backlog
      in: BacklogReq
      out: BacklogOut
      effects: [read, write]
      playbook: features/backlog/playbook.md
      rules: features/backlog/rules.yaml
      review: { when: never }
      schedule: weekly
    implement:
      description: "On demand, for one user-approved item: a reviewed framework proposal draft (for forge) or a mode-fix task, behind an approval gate."
      workflow: implement
      in: FindingRef
      out: ImplementOut
      effects: [read, write]
      playbook: features/implement/playbook.md
      rules: features/implement/rules.yaml
      review: { role: reviewer, when: always, tier: deep, effort: high }
    verify:
      description: "Re-run a finding's detector on newer data; verified if the pattern is gone, reopened if not."
      workflow: verify
      in: FindingRef
      out: VerifyOut
      effects: [read, write]
      playbook: features/verify/playbook.md
      rules: features/verify/rules.yaml
      review: { when: never }
  coordinator: lead
  roles: { lead: improve-local, analyst: improve-local, reviewer: workspace }   # role -> env
  workflows:
    scan:
      - { id: detect, run: improve.detect/v1.sessions, with: { since: "$in.since|$config.window", until: "$in.until" } }
      - { id: store, run: improve.findings/v1.upsert, with: { candidates: "$steps.detect.candidates", by: improve.scan } }
      - { id: patterns, role: analyst, out: Patterns, task: "Find recurring patterns the detectors missed, from the episode summaries in detect.episodes and the stored findings in store.summary; return only patterns whose evidence cites those episode ids (an empty list is a valid answer)." }
      - { id: resolve, run: improve.detect/v1.resolve, with: { findings: "$steps.patterns.findings" } }
      - { id: record, run: improve.findings/v1.upsert, with: { candidates: "$steps.resolve.accepted", by: analyst, rejected: "$steps.resolve.rejected", detected: "$steps.store.findings" } }
    audit:
      - { id: detect, run: improve.detect/v1.artifacts, with: { root: "$in.root" } }
      - { id: store, run: improve.findings/v1.upsert, with: { candidates: "$steps.detect.candidates", by: improve.audit } }
      - { id: judge, role: analyst, out: Patterns, task: "Judge the project against the conformance rules listed in detect.manual (no deterministic check); return violations with file:line evidence (an empty list is a valid answer)." }
      - { id: resolve, run: improve.detect/v1.resolve, with: { findings: "$steps.judge.findings" } }
      - { id: record, run: improve.findings/v1.upsert, with: { candidates: "$steps.resolve.accepted", by: analyst, rejected: "$steps.resolve.rejected", detected: "$steps.store.findings" } }
    triage:
      - { id: rank, run: improve.findings/v1.triage, with: { top: "$in.top|$config.triageTop" } }
      - { id: analyze, role: analyst, out: Analysis, task: "For each finding in rank.top: confirm its evidence, state the root cause, propose a fix (prefer preventive: a check, lint or conformance rule, a test), a route and an effort 1-5." }
      - { review: here, id: review }
      - { id: apply, run: improve.findings/v1.annotate, with: { annotations: "$steps.analyze.annotations" } }
    backlog:
      - { id: report, run: improve.findings/v1.backlog, with: { top: "$in.top|$config.backlogTop", week: "$in.week" } }
    implement:
      - { id: claim, run: improve.findings/v1.claim, with: { id: "$in.id" } }
      - { id: draft, role: analyst, out: Draft, task: "Write the fix for the claimed finding as a framework proposal draft for forge (route forge.extend) or a mode-fix task envelope (user mode). Do not write code." }
      - { review: here, id: review }
      - { id: approve, gate: "The user approves the reviewed draft before it is handed off." }
      - { id: handoff, run: improve.findings/v1.handoff, with: { id: "$in.id", draft: "$steps.draft" } }
    verify:
      - { id: finding, run: improve.findings/v1.get, with: { id: "$in.id" } }
      - { id: recheck, run: improve.detect/v1.recheck, with: { finding: "$steps.finding.finding" } }
      - { id: apply, run: improve.findings/v1.verify, with: { id: "$in.id", present: "$steps.recheck.present", newData: "$steps.recheck.newData", note: "$steps.recheck.note" } }
  constraints:
    policies: [never-modify-artifacts, human-approves-every-fix, redact-transcripts]
  # what its roles may read (read-only endpoints, through the env each role works in) and its code steps use
  needs: [improve.findings/v1, improve.detect/v1, session.events/v1, review.verdicts/v1, artifacts.read/v1, workspace.read/v1, git.read/v1]
  config: config.schema.json
