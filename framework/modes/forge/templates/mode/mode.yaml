apiVersion: agentbay/v2
kind: Mode
metadata:
  name: {{name}}
  version: 0.1.0
  description: "{{intent}}"
spec:
  purpose: "{{intent}}"
  features:
    run:
      description: TODO what this feature does, in one line.
      in: RunReq
      out: RunOut
      effects: [read, write]
      playbook: features/run/playbook.md
      rules: features/run/rules.yaml
      review: { role: reviewer, when: always, tier: balanced, effort: medium }
      steps:
        - { id: work, role: builder, out: RunOut, task: "TODO the job this step does" }
  roles: { builder: workspace, reviewer: workspace }      # role -> the env it works in
  constraints:
    policies: []
  needs: [workspace.read/v1, workspace.write/v1, git.read/v1]   # what its roles may use, in their envs
