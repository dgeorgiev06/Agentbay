apiVersion: agentbay/v2
kind: Connector
metadata:
  name: x-api
  description: >-
    Posts from X via the official X API v2: the authorized account's home timeline
    (GET /2/users/{id}/timelines/reverse_chronological), X Lists (GET /2/lists/{id}/tweets) and user timelines
    (GET /2/users/{id}/tweets). OAuth 2.0 user token with scopes tweet.read users.read offline.access
    (+ list.read for Lists).
  version: 0.2.0
spec:
  implements: items.source/v1
  produces: [post/v1]
  entry: x_api.py
  source: x
  window: 7d
  selectors:
    from: { mode: native, as: "handle (user timeline)", localWith: [in] }   # with `in`, the in stream is read and filtered
    in: { mode: native, as: "home (home timeline) or list:<List id>" }
    since: native
    text: local          # X bills every post the native query returns; text only filters after that
    has: local
    not: local
  needs:
    secrets: [X_CLIENT_ID, X_CLIENT_SECRET, X_REFRESH_TOKEN]
    network: [api.x.com]
  config:
    type: object
    additionalProperties: false
    properties:
      userId: { type: string, description: "Numeric X user id; looked up via /2/users/me when omitted." }
      maxPages: { type: integer, minimum: 1, default: 50 }
      exclude: { type: array, items: { enum: [retweets, replies] }, default: [retweets, replies], description: "X timeline filter (connector-specific)." }
