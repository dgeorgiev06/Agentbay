apiVersion: agentbay/v2
kind: Interface
metadata:
  name: feed.source
  description: A source of posts from accounts the user follows (X, Bluesky, ...). Called only by feed.store/v1.sync through the dispatcher.
spec:
  version: 1
  binding: connector
  endpoints:
    fetch:
      description: >-
        Fetch posts newer than `sinceId` or `startTime`, newest first. `maxPosts` is the timeline read budget:
        the connector never reads (is billed for) more timeline posts than that. `checkIds` are stored post ids
        (without source prefix) to re-check, at most one read each, on top of `maxPosts`; ids it actually
        verified are returned in `checked`, and those the source no longer serves in `deleted`. Source-specific filters (e.g. X's exclude) are connector config, not inputs.
      in:
        type: object
        additionalProperties: false
        properties:
          sinceId: { type: string }
          startTime: { type: string, format: date-time }
          maxPosts: { type: integer, minimum: 1 }
          checkIds: { type: array, items: { type: string } }
      out:
        type: object
        required: [posts, newestId, truncated, billed]
        additionalProperties: false
        properties:
          posts: { type: array, items: { $ref: feed.post/v1 } }
          newestId: { type: [string, "null"] }
          truncated: { type: boolean }
          requests: { type: integer }
          billed: { type: integer, minimum: 0, description: "Posts read from the source in this call (what the provider bills), including deletion checks." }
          checked: { type: array, items: { type: string }, description: "checkIds actually verified in this call." }
          deleted: { type: array, items: { type: string }, description: "Post ids (without source prefix) the source reports deleted." }
          warnings: { type: array, items: { type: string } }
      effects: [network, spend]
