# Copy to <your project>/agentbay.config.yaml. Every setting is optional.
# Settings can only tighten limits: caps take the strictest of mode constraint,
# this file and the env's hard limits.
# Generated by `bay config example` from each extension's config.example.yaml; edit those, not this file.
apiVersion: agentbay/v2

# Where connector secrets come from. keychain (macOS, default) reads
#   security find-generic-password -s agentbay -a <NAME> -w
# env reads environment variables of the same name (use on Linux / CI).
secrets: { provider: keychain }

modes:
  feed-briefing:
    # validated against modes/briefing/config.schema.json (feed-briefing extends briefing)
    lookback: 3d                      # default window for sync/digest/ask (<= lookbackMax 30d)
    retention: 30d                    # prune drops posts older than this
    maxItemsPerRun: 200
    monthlyItems: 3000
    spendUsd: 5
    costPerPostUsd: 0.005             # price per post the source reads (timeline + deletion checks); spendUsd cap
    selectors:                        # which posts to keep; default: [{id: home}] = the home timeline
      - { id: home }
    # - { id: staking, in: list:1585430245762441216 }       # an X List (scope list.read)
    # - { id: vitalik, from: vitalik, not: { text: giveaway } }
    # features:
    #   digest:
    #     extraRules: rules/digest-extra.yaml   # your rules stack on the feature's (strictest wins)

  mail-briefing:
    # read-only mail (sign in: README.md of the mail connector your env binds); briefing's settings plus `important`
    lookback: 30d                     # first sync reads the last 30 days (= lookbackMax)
    selectors:
      - { id: partners, from: "*@kiln.fi" }               # `*` is matched locally: Gmail lists every message in
                                                          # the window; `from: kiln.fi` searches the domain natively
      - { id: staking,  subject: "staking", in: "label:Work" }
      - { id: news,     in: "Newsletters", since: 7d }
      - { id: sent,     in: sent }                        # your replies, so "needs reply" knows what you answered
    important: ["*@kiln.fi", "*@galaxy.com"]              # weighs these senders' threads first in the digest

  # improve:
  #   defaults shown (config.schema.json); detector thresholds default in bay/improve/
  #   window: 7d                      # default scan window (sessions started inside it)
  #   retention: 90d                  # verified and wontfix findings not seen for this long are dropped
  #   backlogTop: 10                  # items in the weekly backlog report
  #   triageTop: 5                    # top open findings the analyst examines per triage
  #   historyDocs: [docs/proposals/]  # markdown kept as history: doc-size and doc-stale skip it
  #   thresholds: { reviewRounds: 1, docWords: 3000 }

# Project workflows: your own sequences of endpoints, run by the Chief of Staff (`cos.run`), one stage at a
# time. `call` is a <mode>.<endpoint>; `with`/`when`/$in/$steps work as they do inside a mode's workflow.
# `bay validate` prints each workflow's stages and the effects it may use.
# workflows:
#   morning:
#     description: refresh the feed, then digest it
#     in: { type: object, properties: { lookback: { type: string } } }
#     steps:
#       - { id: sync,   call: feed-briefing.sync,   with: { lookback: "$in.lookback" } }
#       - { id: digest, call: feed-briefing.digest, when: $steps.sync.added }
#       - { id: ship,   gate: "send the digest?" }     # only `bay approve <runId>` passes this

connectors:
  # fake:
  #   fixture: fixtures/posts.json    # optional; built-in sample posts otherwise
  # fake-mail:
  #   fixture: fixtures/mail.json     # optional; a built-in sample mailbox otherwise
  # gmail-api:
  #   defaults shown; settings can only lower these caps
  #   attachmentMaxBytes: 10485760    # larger attachments keep metadata only
  #   attachmentMaxChars: 200000      # longer extracted text keeps metadata only
  x-api:
    userId: "1234567890"              # your numeric X user id (else looked up via /2/users/me)
    exclude: [retweets, replies]      # X timeline filter
  # claude-transcripts:
  #   root: ~/.claude/projects        # transcripts folder; relative paths are relative to the project

# Offline switch: each entry runs every agent of an env in the shipped env that substitutes it (fake sources,
# no network, $0). Delete an entry to use the real source. Capabilities stay bound only in envs/<env>.yaml.
envs: { local-feeds: local-feeds-offline, local-mail: local-mail-offline }
