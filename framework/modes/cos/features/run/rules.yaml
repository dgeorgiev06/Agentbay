apiVersion: agentbay/v2
kind: Rules
rules:
  - { id: R-1, level: must_not, statement: "A stage must not be executed inside this endpoint; return it as nextCall for the coordinator to run.", appliesTo: both, refs: [DOD-4] }
  - { id: R-2, level: must, statement: "Run only a workflow the user configured in agentbay.config.yaml; never synthesise or edit one.", appliesTo: both, refs: [DOD-1] }
  - { id: R-3, level: must_not, statement: "Output, logs or the ledger must not contain secret values.", appliesTo: both, check: no_secrets }
