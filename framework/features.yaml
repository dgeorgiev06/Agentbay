# The kernel's features. Each is a deep module: other features import only its entry files.
# Words are defined in CONTEXT.md; the rule is docs/adr/0006.
# Enforced by tests/feature-map.test.ts. The breaks it still allows are listed in framework/feature-map-debt.yaml.

features:
  vocabulary:
    purpose:
      The types and small helpers every feature shares, including the generated manifest types. No behaviour
      of its own.
    entry:
      - bay/contracts.ts
      - bay/outcome.ts
      - bay/json.ts
      - bay/layout.ts
      - bay/ports.ts
      - bay/version.ts
      - bay/generated/config.ts
      - bay/generated/interface.ts
      - bay/generated/mode.ts
      - bay/generated/skill.ts
      - bay/generated/workflow.ts
      - bay/answers.ts
      - bay/protocol-json.ts
    private: []
    may_import: []
  platform:
    purpose: The real adapters for the ports - files, clock, processes, network, terminal.
    entry:
      - bay/node-ports.ts
    private:
      - bay/owner-only.ts
    may_import:
      - vocabulary
  manifests:
    purpose: Reads modes, interfaces, skills, workflows and the config into one checked system.
    entry:
      - bay/manifests/manifests.ts
    private:
      - bay/manifests/spec.ts
      - bay/manifests/references.ts
      - bay/manifests/folders.ts
      - bay/manifests/schemas.ts
      - bay/manifests/loaded.ts
      - bay/manifests/interfaces.ts
      - bay/manifests/bindings.ts
      - bay/manifests/activation.ts
      - bay/manifests/naming.ts
      - bay/manifests/binding-problems.ts
      - bay/manifests/implements-problems.ts
      - bay/manifests/action-schemas.ts
      - bay/manifests/action-problems.ts
      - bay/manifests/file-references.ts
      - bay/manifests/workflow-problems.ts
      - bay/manifests/settings-problems.ts
      - bay/manifests/grants.ts
      - bay/manifests/inspection.ts
      - bay/manifests/placement.ts
    may_import:
      - vocabulary
      - safety
  safety:
    purpose: Turns a mode's manifest into its grants.
    entry:
      - bay/policy.ts
    private: []
    may_import:
      - vocabulary
  secrets:
    purpose: Stores the owner's secrets and scrubs them from anything that is written or shown.
    entry:
      - bay/secrets.ts
    private:
      - bay/secret-patterns.ts
    may_import:
      - vocabulary
      - manifests
      - safety
  broker:
    purpose:
      Every request for a database, file, secret, host or event passes through here, and it applies grants and
      effects. Runs a mode's script in a confined child process and gives it the toolbox.
    entry:
      - bay/broker/broker.ts
      - bay/broker/script-runner.ts
      - bay/sdk.ts
    private:
      - bay/broker/file-access.ts
      - bay/broker/http-access.ts
      - bay/broker/database.ts
      - bay/broker/database-child.ts
      - bay/broker/database-process.ts
      - bay/broker/agent-query.ts
      - bay/broker/query-child.ts
      - bay/broker/script-host.ts
      - bay/broker/script-preload.ts
      - bay/broker/script-protocol.ts
      - bay/broker/sql-statements.ts
      - bay/broker/folder-links.ts
      - bay/broker/operations.ts
      - bay/broker/rule.ts
      - bay/broker/file-operations.ts
      - bay/broker/database-operations.ts
      - bay/broker/other-operations.ts
      - bay/broker/http-operations.ts
      - bay/broker/command-operations.ts
    may_import:
      - vocabulary
      - safety
      - secrets
  runs:
    purpose: Advances a run step by step, durably - waiting, resuming, budgets, approvals, undo.
    entry:
      - bay/runs/runs.ts
    private:
      - bay/runs/engine.ts
      - bay/runs/action-steps.ts
      - bay/runs/workflow-steps.ts
      - bay/runs/skill-steps.ts
      - bay/runs/walk.ts
      - bay/runs/undo.ts
      - bay/runs/waiting.ts
      - bay/runs/budget.ts
      - bay/runs/run-state.ts
      - bay/runs/run-store.ts
      - bay/runs/sqlite-run-store.ts
      - bay/runs/scrubbed-store.ts
      - bay/runs/step-key.ts
      - bay/runs/step-detail.ts
      - bay/runs/task-tokens.ts
    may_import:
      - vocabulary
      - manifests
      - safety
      - secrets
      - broker
  agent-tools:
    purpose: The tools a harness's agent may call during a skill step, and the server that offers them.
    entry:
      - bay/tools.ts
    private:
      - bay/tool-definitions.ts
      - bay/skill-tools.ts
      - bay/mcp-server.ts
    may_import:
      - vocabulary
      - manifests
      - safety
      - broker
      - runs
  check:
    purpose: Says whether a kit and project are well formed, in sentences an owner can act on.
    entry:
      - bay/check.ts
    private:
      - bay/check-context.ts
      - bay/check-imports.ts
      - bay/check-layout.ts
      - bay/check-limits.ts
      - bay/check-skills.ts
      - bay/import-scanner.ts
    may_import:
      - vocabulary
      - manifests
      - safety
  scaffold:
    purpose: Generates a new mode, action, skill, interface or workflow from templates.
    entry:
      - bay/new.ts
    private: []
    may_import:
      - vocabulary
      - manifests
  harness:
    purpose: What a harness adapter must provide, and the build that asks it to.
    entry:
      - bay/adapter.ts
      - bay/build.ts
    private: []
    may_import:
      - vocabulary
      - manifests
      - safety
      - broker
  kernel:
    purpose: Puts the features together into one running kernel.
    entry:
      - bay/kernel.ts
    private: []
    may_import:
      - vocabulary
      - platform
      - manifests
      - safety
      - secrets
      - broker
      - runs
      - agent-tools
      - harness
  command-line:
    purpose: "The process entry points: the bay commands and the tool server. Parses, calls the kernel, prints."
    entry:
      - bay/cli.ts
      - bay/mcp.ts
    private:
      - bay/command-line.ts
      - bay/command-context.ts
      - bay/commands.ts
      - bay/commands/actions.ts
      - bay/commands/approve.ts
      - bay/commands/build.ts
      - bay/commands/call.ts
      - bay/commands/check.ts
      - bay/commands/config.ts
      - bay/commands/new.ts
      - bay/commands/not-built.ts
      - bay/commands/resume.ts
      - bay/commands/runs.ts
      - bay/commands/secret.ts
      - bay/commands/submit.ts
      - bay/run-report.ts
      - bay/terminal.ts
      - bay/last-resort.ts
      - bay/settings-listing.ts
    may_import:
      - agent-tools
      - broker
      - check
      - harness
      - kernel
      - manifests
      - platform
      - runs
      - safety
      - scaffold
      - secrets
      - vocabulary
modes:
  purpose:
    Every folder under components/ that holds a mode.yaml is a mode. A mode is outside the kernel. A file under a
    mode's tests/ folder imports the test toolbox, the toolbox, files of its own mode and the shared test of each
    interface the mode implements, and nothing else.
  within: components
  imports_kernel_through:
    - bay/sdk.ts
  tests_import_kit_through:
    - tests/test-toolbox.ts
interfaces:
  purpose:
    Every <name>.yaml in components/base/interfaces is an interface. Its shared test, <name>/tests/shared.ts, states
    what every mode that implements the interface must do. A shared test imports only the test toolbox, and only the
    tests of a mode that implements the interface import it.
  within: components/base/interfaces
  shared_test: tests/shared.ts
  shared_tests_import_kit_through:
    - tests/test-toolbox.ts
outside:
  adapters/claude-code:
    purpose: Fits Claude Code to the kernel - agent files, the step guard, settings, the tool server config.
    entry:
      - adapters/claude-code/adapter.ts
      - adapters/claude-code/step-guard.ts
    imports_kernel_through:
      - bay/adapter.ts
  schemas:
    purpose: The type generator, a development tool. It writes bay/generated/ from the schemas; it is not kernel code.
    imports_kernel_through:
      - bay/node-ports.ts
      - bay/ports.ts
