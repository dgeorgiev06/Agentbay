name: git-worktrees
version: 1.0.0
description: Makes a worktree and branch for each slice, says where it stands, commits its work to its branch, merges it and sets its work aside, and makes throwaway copies of commits and applies patches to them, running git so that no code from the repository runs.

implements: [worktrees@1]

resources:
  db: { migrations: migrations }
  files:
    throwaway: [.forge/copies/]
  commandsStartWith: git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c submodule.recurse=false
  commands:
    commit-of:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 rev-parse --verify --quiet --end-of-options
      effects: [read]
    repository-filters:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 config --show-scope --name-only --get-regexp ^(filter\.|merge\..*\.driver$)
      effects: [read]
    add-detached-worktree:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 worktree add --detach --end-of-options
      effects: [read, write]
    make-branch:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 branch --end-of-options
      effects: [read, write]
    switch-branch:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 switch --end-of-options
      effects: [read, write, delete]
    changes:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 --no-optional-locks status --porcelain=v1 -z --untracked-files=all --ignore-submodules=all --
      effects: [read]
    commits-between:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 log -z --reverse --no-show-signature --no-color --format=%H%x20%s --end-of-options
      effects: [read]
    changed-paths:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 diff-tree -r --name-status -z -M --no-ext-diff --no-textconv --no-color --no-relative --end-of-options
      effects: [read]
    is-ignored:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 check-ignore --quiet --end-of-options
      effects: [read]
    paths-at-commit:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 ls-tree -z --name-only --end-of-options
      effects: [read]
    untracked-paths:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 ls-files -z --others --directory --end-of-options
      effects: [read]
    restore-paths:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 -c core.autocrlf=false --git-dir=../../../.git --work-tree=. restore --worktree --source
      effects: [read, write, network, spend, delete]
    is-ancestor:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 merge-base --is-ancestor --end-of-options
      effects: [read]
    remove-worktree:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 worktree remove --end-of-options
      effects: [read, write, delete]
    delete-branch:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 branch -d --end-of-options
      effects: [read, write, delete]
    add-worktree:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 worktree add --end-of-options
      effects: [read, write]
    merge-branch:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 -c user.name=agentbay-git-worktrees -c user.email=git-worktrees@agentbay.invalid -c gc.auto=0 merge --no-ff --no-edit --no-stat --no-verify --no-gpg-sign --no-verify-signatures --no-autostash --no-rerere-autoupdate --end-of-options
      effects: [read, write, delete]
    abort-merge:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 -c user.name=agentbay-git-worktrees -c user.email=git-worktrees@agentbay.invalid -c gc.auto=0 merge --abort
      effects: [read, write, delete]
    stage-everything:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 add --all --
      effects: [read, write, delete]
    commit-staged:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 -c user.name=agentbay-git-worktrees -c user.email=git-worktrees@agentbay.invalid -c gc.auto=0 commit --quiet --allow-empty --no-verify --no-gpg-sign --file=- --end-of-options
      effects: [read, write, delete]
    filters-of-paths:
      run: --work-tree=. check-attr -z filter --
      effects: [read]
    apply-patch:
      run: --work-tree=. apply --end-of-options
      effects: [read, write, delete]
    make-repository:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 init --quiet --template= --initial-branch=copy --end-of-options
      effects: [read, write]
    repository-top:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 rev-parse --show-prefix --absolute-git-dir --show-toplevel
      effects: [read]
    forget-paths:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 --work-tree=. rm --cached -r --quiet --ignore-unmatch --
      effects: [read, write, delete]
    stage-paths:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 --work-tree=. add --all --force --
      effects: [read, write, delete]
    checked-out-branch:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 symbolic-ref --quiet --end-of-options
      effects: [read]
    merge-uncommitted:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 -c user.name=agentbay-git-worktrees -c user.email=git-worktrees@agentbay.invalid -c gc.auto=0 merge --no-ff --no-commit --no-squash --no-stat --no-verify --no-gpg-sign --no-verify-signatures --no-autostash --no-rerere-autoupdate --end-of-options
      effects: [read, write, delete]
    fast-forward:
      run: --attr-source=4b825dc642cb6eb9a060e54bf8d69288fbee4904 -c user.name=agentbay-git-worktrees -c user.email=git-worktrees@agentbay.invalid -c gc.auto=0 merge --ff-only --no-stat --no-verify --no-gpg-sign --no-verify-signatures --no-autostash --no-rerere-autoupdate --end-of-options
      effects: [read, write, delete]

actions:
  cut:
    description: When a slice needs its own branch and worktree, cut from a commit, under .forge/worktrees/ in the project.
    effects: [read, write, delete]
    run:
      - script: scripts/cut.ts
  status:
    description: When a mode or a skill needs to know where a slice's worktree stands, its head, its commits since the base, and its changed and untracked files.
    effects: [read]
    run:
      - script: scripts/status.ts
  changed:
    description: When a mode or a skill needs each path that differs between two commits, and whether it was added, changed, deleted or renamed.
    effects: [read]
    run:
      - script: scripts/changed.ts
  copy:
    description: When a mode needs a throwaway copy of a commit's files under .forge/copies/, a repository of its own holding them as one commit, with links to ignored folders of the project such as installed packages, ignored in the copy too.
    effects: [read, write, network, spend, delete]
    run:
      - script: scripts/copy.ts
  overlay:
    description: When a copy needs some of its paths as they are at another commit; a path absent there is removed, and the change is committed in the copy. It never changes a worktree.
    effects: [read, write, network, spend, delete]
    run:
      - script: scripts/overlay.ts
  remove:
    description: When a copy is no longer needed, or a slice's worktree is clean; the worktree goes with its branch when that is merged, or its branch is kept at its commit when the caller asks, and anything else is refused.
    effects: [read, write, delete]
    run:
      - script: scripts/remove.ts
  merge:
    description: When a slice's worktree is clean and its branch is to be merged into another branch, with a merge commit made in a worktree of the mode's own; a branch the project's own folder has checked out is then fast-forwarded only when the folder is clean and the branch has not moved, and a conflict undoes the merge and names the paths.
    effects: [read, write, delete]
    run:
      - script: scripts/merge.ts
  set-aside:
    description: When a slice's worktree has changed or untracked files to keep but not on its branch; they are committed to a new branch forge/wip/<slice>/<n>, and the worktree goes back to its head with no changes.
    effects: [read, write, delete]
    run:
      - script: scripts/set-aside.ts
  commit:
    description: When a slice's worktree has changed or untracked files to keep on its own branch; they are committed to forge/<slice> with the message given, and they stay in the worktree, which is then clean.
    effects: [read, write, delete]
    run:
      - script: scripts/commit.ts
  apply:
    description: When a copy needs a patch applied to it, all of it or nothing, committed in the copy; a path outside the copy is refused before git runs. It never changes a worktree.
    effects: [read, write, delete]
    run:
      - script: scripts/apply.ts
