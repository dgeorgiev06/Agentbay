apiVersion: agentbay/v1
kind: Layer
metadata:
  name: github
  description: EXAMPLE of an MCP layer. Not used by default; add to an agent's layers to enable.
  tier: domain
spec:
  requires: [base]
  mcpServers:
    github:
      type: http
      url: https://api.githubcopilot.com/mcp/
  # MCP tools are granted by name: mcp__<server>__<tool>
  tools: [mcp__github__get_issue, mcp__github__list_issues, mcp__github__get_pull_request]
  prompt: |
    You can read GitHub issues and pull requests through the github MCP server.
    Read only; never create or modify GitHub content.
