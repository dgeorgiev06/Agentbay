name: rounds
trigger: { manual: true }
budget: { minutes: 180 }
steps:
  - id: look
    action: leftovers
    input:
      request: $trigger
  - id: slice
    action: slice
    input:
      request: $trigger
      planter: true
      leftovers: $steps.look.output.leftovers
  - id: start
    approval: Build this slice?
    show: $steps.slice.output.card
    choices:
      build: { does: Cut the worktree and start round 1, when: $steps.slice.output.offered.build }
      build-without-interface:
        { does: Go ahead with no agreed interface, when: $steps.slice.output.offered.build-without-interface }
      build-over: { does: "Drop the earlier run's branches, then build", when: $steps.slice.output.offered.build-over }
      build-over-without-interface:
        {
          does: "Drop the earlier run's branches, then go ahead with no agreed interface",
          when: $steps.slice.output.offered.build-over-without-interface,
        }
      stop: { does: Stop; nothing is cut }
  - id: begin
    action: begin
    input:
      choice: $steps.start.output.choice
      leftovers: $steps.look.output.leftovers
      into: $settings.into
  - id: cut
    action: worktrees.cut
    input:
      slice: $steps.slice.output.slice.name
      base: $steps.slice.output.base
  - id: pin
    action: pin
    input:
      interface: $steps.slice.output.interface
      folder: $steps.cut.output.folder
  - id: declare
    action: declare
    input:
      slice: $steps.slice.output.slice
      folder: $steps.cut.output.folder
      practices: $settings.practices
      fixed: $steps.slice.output.fixed
  - id: round-1
    action: round
    input:
      round: 1
      slice: $steps.slice.output.slice
      interface: $steps.slice.output.interface
      rules: $steps.slice.output.rules
      fixed: $steps.slice.output.fixed
      cut: $steps.cut.output
      declared: $steps.declare.output
      practices: $settings.practices
      before: null
  - id: review-1
    action: review-round
    input:
      slice: $steps.slice.output.slice
      fixed: $steps.slice.output.fixed
      practices: $settings.practices
      interface: $steps.slice.output.interface
      rules: $steps.slice.output.rules
      state: $steps.round-1.output
  - id: round-2
    action: round
    input:
      round: 2
      slice: $steps.slice.output.slice
      interface: $steps.slice.output.interface
      rules: $steps.slice.output.rules
      fixed: $steps.slice.output.fixed
      cut: $steps.cut.output
      declared: $steps.declare.output
      practices: $settings.practices
      before: $steps.review-1.output
  - id: review-2
    action: review-round
    input:
      slice: $steps.slice.output.slice
      fixed: $steps.slice.output.fixed
      practices: $settings.practices
      interface: $steps.slice.output.interface
      rules: $steps.slice.output.rules
      state: $steps.round-2.output
  - id: round-3
    action: round
    input:
      round: 3
      slice: $steps.slice.output.slice
      interface: $steps.slice.output.interface
      rules: $steps.slice.output.rules
      fixed: $steps.slice.output.fixed
      cut: $steps.cut.output
      declared: $steps.declare.output
      practices: $settings.practices
      before: $steps.review-2.output
  - id: review-3
    action: review-round
    input:
      slice: $steps.slice.output.slice
      fixed: $steps.slice.output.fixed
      practices: $settings.practices
      interface: $steps.slice.output.interface
      rules: $steps.slice.output.rules
      state: $steps.round-3.output
  - id: bugs
    action: bugs
    input:
      slice: $steps.slice.output.slice
      interface: $steps.slice.output.interface
      fixed: $steps.slice.output.fixed
      bugs: $steps.slice.output.bugs
      state: $steps.review-3.output
  - id: prove
    action: final-proof
    input:
      slice: $steps.slice.output.proved
      base: $steps.cut.output.commit
      head: $steps.review-3.output.head
      declared: $steps.review-3.output.declared
      bugs: $steps.bugs.output.bugs
      examples: $steps.slice.output.examples
  - id: draw
    action: draw
    input:
      slice: $steps.slice.output.proved
      proof: $steps.prove.output
      built: $steps.review-3.output.built
      work: $steps.review-3.output.branch
      kept: with-tests
      caseMessages: filtered
      into: $settings.into
      rounds: $steps.review-3.output
      pinned: $steps.pin.output.pinned
      bugs: $steps.bugs.output.bugs
      planted: $steps.bugs.output.planted
      stayed: $steps.bugs.output.stayed
  - id: card
    approval: Merge this slice?
    show: $steps.draw.output.card
    quotes: [review-1, review-2, review-3, round-1, round-2, round-3]
    choices:
      merge: { does: Merge into the integration branch, when: $steps.draw.output.merge }
      send-back: { does: "A round after the card", when: $steps.draw.output.sendBack }
      keep: { does: Stop; the branches stay }
      discard: { does: Stop; the worktrees go, when: $steps.draw.output.discard }
  - id: carry-out
    action: carry-out
    input:
      choice: $steps.card.output.choice
      name: $steps.slice.output.slice.name
      branch: $steps.review-3.output.builder.branch
      work: $steps.review-3.output.branch
      head: $steps.review-3.output.head
      into: $settings.into
