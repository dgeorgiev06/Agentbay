name: typescript
version: 1.0.0
description: Checks and tests TypeScript code in a checkout, and runs its scripts, by the names in its own package.json.

implements: [toolchain@1]

resources:
  files:
    read: [package.json]
  commands:
    read-package:
      run: cat -- package.json
      effects: [read]
    check-generated-types:
      run: npm run generate:check --
      effects: [read, write, network, spend, delete]
    check-types:
      run: npm run typecheck --
      effects: [read, write, network, spend, delete]
    lint:
      run: npm run lint --
      effects: [read, write, network, spend, delete]
    check-format:
      run: npm run format:check --
      effects: [read, write, network, spend, delete]
    find-dead-code:
      run: npm run deadcode --
      effects: [read, write, network, spend, delete]
    run-tests:
      run: npm test -- --test-reporter=tap
      effects: [read, write, network, spend, delete]
    print-folder:
      run: pwd -P
      effects: [read]
    run-script:
      run: npm run --silent --
      effects: [read, write, network, spend, delete]

extraFiles: [eslint.config.js, prettier.json, practices.md]

actions:
  describe:
    description: When a mode or a skill needs to know the language, which files are source and tests, where its practices are, which checks it has, and which of the agreed scripts the project has and lacks.
    effects: [read]
    run:
      - script: scripts/describe.ts
  check:
    description: When a mode or a skill needs to know whether a checkout passes the type check, lint, format and dead-code checks, or a named few of them.
    effects: [read, write, network, spend, delete]
    scriptTimeLimitSeconds: &suite 3630
    run:
      - script: scripts/check.ts
  test:
    description: When a mode or a skill needs to know whether the tests of a checkout pass, all of them or the named test files.
    effects: [read, write, network, spend, delete]
    scriptTimeLimitSeconds: *suite
    run:
      - script: scripts/run-tests.ts
  run:
    description: When a mode or a skill needs one of the project's own package.json scripts run by its name in a throwaway copy, with how it ended and what it printed.
    effects: [read, write, network, spend, delete]
    scriptTimeLimitSeconds: *suite
    run:
      - script: scripts/run.ts
