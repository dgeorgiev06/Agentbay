apiVersion: agentbay/v3
kind: Connector
metadata:
  name: corpus-store
  description: >-
    items.store/v1 on one SQLite file per mode (<data>/<mode>/corpus.db) holding exactly the mode's scope:
    items with selector tags and an FTS5 full-text index. Cursors, coverage, budget and deletions live in
    <mode>/state.json, which agents never read. Reads are read-only connections over temp views; agent SQL
    runs in the bay/sqlsandbox.py sandbox.
  version: 0.1.0
spec:
  implements: items.store/v1
  entry: corpus_store.py
  needs:
    capabilities: [items.source/v1]
