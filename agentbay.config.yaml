modes: [feed-briefing, typescript, git-worktrees]
bindings:
  items-source: fake-source
  items-store: store
  toolchain: typescript
  worktrees: git-worktrees
  proof: proof
adapter: claude-code
settings:
  forge:
    featureMap: framework/features.yaml
  feed-briefing:
    selector:
      labels: [staking, custody]
    lookback: 15d
    maxItems: 40
  fake-source:
    baseDate: "2026-11-15T00:00:00Z"
    pageSize: 10
    costPerItemUsd: 0.001
