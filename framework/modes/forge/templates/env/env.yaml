apiVersion: agentbay/v2
kind: Environment
metadata:
  name: {{name}}
  description: "{{intent}}"
spec:
  bind:
    workspace.read/v1: { tools: [Read, Glob, Grep] }
  secrets: { provider: keychain, allow: [] }
  network: { allow: [] }
  fs: { read: ["."], write: [] }
  effects: [read]
  limits: { maxTurns: 30, maxMinutes: 15 }
