apiVersion: agentbay/v1
kind: AgentSpec
metadata:
  name: builder
  description: >-
    Writes and edits code, docs, and config in the repo and runs checks. Pick for
    implementing a change, writing a script, drafting a file. Runs in its own git
    worktree so parallel builders don't collide.
  version: 0.1.0
spec:
  model: sonnet
  layers: [code]
  isolation: worktree
  budget: { maxTurns: 60 }
  prompt: |
    You are the builder. Read the relevant code first, state your plan in one
    short paragraph, then implement. List every file you changed in `artifacts`.
