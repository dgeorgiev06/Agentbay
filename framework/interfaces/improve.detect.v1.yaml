apiVersion: agentbay/v2
kind: Interface
metadata:
  name: improve.detect
  description: >-
    improve's deterministic analysis over session.events/v1, review.verdicts/v1 and artifacts.read/v1. Returns
    candidate findings (improve.finding/v1 without id, status and history); it never writes - improve.findings/v1
    stores them.
spec:
  version: 1
  binding: connector
  endpoints:
    sessions:
      description: Session lens - episodes in the window -> session detectors. Also returns episode summaries (counts and names only) for the analyst.
      in:
        type: object
        additionalProperties: false
        properties:
          since: { type: string, description: "ISO-8601 or relative (7d)" }
          until: { type: string }
      out:
        type: object
        required: [candidates, episodes, stats, window]
        additionalProperties: false
        properties:
          candidates: { type: array, items: { type: object } }
          episodes: { type: array, items: { type: object }, description: "episode summaries (max 300)" }
          episodesTotal: { type: integer }
          stats: { type: object }
          window: { type: object }
          warnings: { type: array, items: { type: string } }
      effects: [read]
    artifacts:
      description: Artifact lens - slop, unused, inefficient and conformance detectors over files and the reference graph.
      in:
        type: object
        additionalProperties: false
        properties:
          root: { enum: [project, kit] }
      out:
        type: object
        required: [candidates, manual, stats]
        additionalProperties: false
        properties:
          candidates: { type: array, items: { type: object } }
          manual: { type: array, description: "conformance rules without a deterministic check, for the auditor" }
          stats: { type: object }
          warnings: { type: array, items: { type: string } }
      effects: [read]
    resolve:
      description: >-
        Check analyst/auditor findings: every evidence ref must resolve (episode in the sources, file and line that
        exist, commit in git, rule id); measurement-only evidence is refused; session patterns need >= 2 episodes
        unless severe. Accepted findings come back as candidates.
      in:
        type: object
        additionalProperties: false
        properties:
          findings:
            type: array
            items:
              type: object
              required: [lens, title, pattern, evidence]
              additionalProperties: false
              properties:
                lens: { enum: [sessions, artifacts] }
                title: { type: string, maxLength: 200 }
                pattern: { type: string, maxLength: 600 }
                evidence: { type: array, minItems: 1, items: { type: object } }
                scope: { type: object }
                severity: { enum: [low, medium, high, severe] }
                rootCause: { type: string, maxLength: 800 }
                proposedFix: { type: string, maxLength: 800 }
                rule: { type: string }
      out:
        type: object
        required: [accepted, rejected]
        additionalProperties: false
        properties:
          accepted: { type: array, items: { type: object } }
          rejected: { type: array, items: { type: object } }
      effects: [read]
    recheck:
      description: Re-run a finding's detector on data newer than its fix; `present` is null when the finding has no deterministic detector.
      in:
        type: object
        required: [finding]
        additionalProperties: false
        properties:
          finding: { $ref: improve.finding/v1 }
      out:
        type: object
        required: [present, newData]
        additionalProperties: false
        properties:
          present: { type: [boolean, "null"] }
          newData: { type: integer, minimum: 0 }
          note: { type: string }
      effects: [read]
