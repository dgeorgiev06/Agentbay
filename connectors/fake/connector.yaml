apiVersion: agentbay/v2
kind: Connector
metadata:
  name: fake
  description: Offline feed.source/v1 for tests and demos. Serves posts from a JSON fixture (or a built-in sample) with no network and no secrets.
  version: 0.1.0
spec:
  implements: feed.source/v1
  entry: fake.py
  source: fake
  window: 7d
  needs: {}
  config:
    type: object
    additionalProperties: false
    properties:
      fixture: { type: string, description: "Path (relative to the project) of a JSON list of {id, handle, name, text, ageHours}." }
      deleted: { type: array, items: { type: string } }
