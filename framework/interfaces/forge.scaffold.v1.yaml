apiVersion: agentbay/v3
kind: Interface
metadata:
  name: forge.scaffold
  description: >-
    Render a forge template (mode, feature, connector, env) into user space. Shared by `bay new <kind>` and
    forge.create. Also reads a proposal's approval status for forge.extend.
spec:
  version: 1
  binding: connector
  dispatcherOnly: true        # code steps only: no role reads it, even in a mode that needs it
  endpoints:
    create:
      in:
        type: object
        required: [kind, name]
        additionalProperties: false
        properties:
          kind: { enum: [mode, feature, connector, env] }
          name: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
          target: { type: string, description: "kind=feature: the mode to add it to" }
          implements: { type: string, description: "kind=connector: interface, e.g. items.source/v1" }
          intent: { type: string }
      out:
        type: object
        required: [kind, name, files]
        additionalProperties: false
        properties:
          kind: { type: string }
          name: { type: string }
          files: { type: array, items: { type: string } }
          todo: { type: array, items: { type: string } }
      effects: [write]
    proposal:
      description: >-
        The approval status in a proposal's front matter (`status: approved` with `approvedBy` and `date`). It is
        informational: it grants nothing: only a recorded `bay approve` of the proposal's exact content skips
        `propose` and the `approve` gate. `plan` says whether the plan step runs before the gate: `approvals.plan` is
        always, or large (the default) and the proposal is large or security-sensitive, and docs/plans/<id>.md does
        not exist yet; `why` names the reason.
      in:
        type: object
        additionalProperties: false
        properties:
          path: { description: "A proposal (docs/proposals/<id>.md), or the list of files the propose step wrote (its first docs/proposals file; none means no plan)." }
      out:
        type: object
        required: [path, plan, why]
        additionalProperties: false
        properties:
          path: { type: string }
          status: { type: string }
          approvedBy: { type: string }
          date: { type: string }
          plan: { type: boolean }
          why: { type: string }
      effects: [read]
